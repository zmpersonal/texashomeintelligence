name: Tree Trimming
copy_status: draft
eyebrow: "FREE TREE SERVICE QUOTE TOOL FOR {CITY} HOMEOWNERS"
hero_tagline: "Get Better Tree Trimming & Removal Quotes, Faster."
hero_body: >-
  Tell us about the tree once. Get a clear QuoteReady Tree Brief you can use
  with any tree service &mdash; so estimates are easier to compare and
  nothing important gets left out.
hero_microcopy: "Free &bull; Takes about 3&ndash;5 minutes &bull; Use it with any tree service &bull; No phone number required to start"

permit_note: >-
  Many Texas cities regulate or protect certain trees, especially larger
  heritage or protected species. Your Project Brief can flag when a permit
  question is worth asking &mdash; it does not replace checking with your
  local tree ordinance.

intake_focus: "Tree size and type if known, proximity to structures, dead limbs, storm damage, lean, access constraints, whether you want trimming or removal, stump handling, and photos."
data_note: "Live local metrics for this page will draw on drought and rainfall data, wind and storm history, soil data, and municipal tree-permit activity."

sections:
  - heading: "One Tree Company Wants to Trim It. Another Wants to Take It Down."
    body: |
      <p>Tree estimates can vary because companies don&rsquo;t always agree on the right scope &mdash; trim versus remove, how much canopy to take, whether the stump comes out, and whether cleanup and hauling are included.</p>
      <p>A price without a clear scope tells you very little.</p>

  - heading: "Describe the Tree. QuoteReady Organizes the Rest."
    body: |
      <p>Leaning after a storm? Dead limbs over the roof? Roots lifting the driveway?</p>
      <p>You don&rsquo;t need to know the species or the arborist terms. QuoteReady organizes size, location, condition, access, and your goals into a brief a tree service can quickly understand.</p>

  - heading: "What Is a Tree Service Project Brief?"
    body: |
      <p>A tree service project brief is a standardized summary of a tree&rsquo;s condition and the work being considered &mdash; trimming, removal, or storm cleanup.</p>
      <p>It can include the tree&rsquo;s size and type if known, its proximity to structures or power lines, visible damage or lean, access constraints, whether you want trimming or full removal, stump handling, photos, and questions a tree service should answer.</p>
      <p>The brief does not replace an on-site arborist evaluation, especially for trees that may pose a safety risk.</p>

  - heading: "What Information Helps When Getting Tree Service Quotes?"
    body: |
      <p>Useful information includes the tree&rsquo;s approximate size and species if known, how close it is to your home, fence, or power lines, any visible dead limbs, lean, or storm damage, ground access for equipment, and whether you want the stump removed.</p>
      <p>Photos taken from a few different angles, including the base and the crown, are especially useful.</p>

  - heading: "Compare the Scope Before You Compare the Price."
    body: |
      <p>Tree service estimates can differ in whether they include full cleanup and haul-away, stump grinding, permit handling for protected trees, and liability insurance.</p>
      <p>Ask what&rsquo;s included, then compare the total.</p>

closing_heading: "Get the Tree Job Clear Before You Choose a Tree Service."
closing_body: >-
  Tell us about the tree once. Get your Project Brief. Use it with a tree
  service you already trust, or ask Texas Home Intelligence for optional
  help finding local pros.

faq:
  - q: "Do I need a permit to remove a tree in Texas?"
    a: "It depends on your city and the tree. Many Texas cities protect certain heritage or large trees and require a permit before removal. Your Project Brief can flag the question; check your local ordinance or ask your tree service to confirm."
  - q: "Should you get multiple tree service quotes?"
    a: "For larger jobs, storm-damaged trees, or removals near structures, yes &mdash; scope and safety approach can vary meaningfully between companies."
  - q: "Can you use your Tree Brief with any tree service?"
    a: "Yes. Use it with any tree service you choose. Help finding local professionals through Texas Home Intelligence is optional."
