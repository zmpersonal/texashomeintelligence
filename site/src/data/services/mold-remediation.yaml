name: Mold Remediation
copyStatus: draft
eyebrow: "FREE MOLD REMEDIATION QUOTE TOOL FOR {CITY} HOMEOWNERS"
heroTagline: "Get Better Mold Remediation Quotes, Faster."
heroBody: >-
  Tell us what you’re seeing once. Get a clear QuoteReady Mold Brief
  you can use with any licensed mold professional — and understand
  what each quote actually includes before you compare price.
heroMicrocopy: "Free • Takes about 3–5 minutes • Use it with any mold professional • No phone number required to start"

licensingNote: >-
  Texas separates mold assessment from mold remediation, and generally
  requires each to be performed by a different licensed company. A
  QuoteReady Brief helps you ask the right questions of either type of
  provider — it does not substitute for a licensed assessment.

intakeFocus: "Visible conditions, suspected moisture source, any prior water event, approximate affected area, whether testing or assessment has occurred, and prior remediation history."
dataNote: "Live local metrics for this page will draw on rainfall and humidity data, flood context, Texas Department of Insurance water-loss data, and local housing-age data."

sections:
  - heading: "Mold Quotes Are Hard to Compare When You Don’t Know the Scope Yet."
    body: |
      <p>One estimate covers containment, air scrubbing, and disposal of affected materials. Another is a flat number with no explanation of what’s included.</p>
      <p>Without a clear scope, you can’t tell whether a lower price means less work — or just less detail.</p>

  - heading: "Describe What You See. QuoteReady Organizes the Rest."
    body: |
      <p>You don’t need to know the type of mold or the technical cause.</p>
      <p>Tell us where you see it, how large an area is affected, whether there was a leak or flood, and whether anyone has already tested or assessed it. QuoteReady turns that into a brief a mold professional can use.</p>

  - heading: "What Is a Mold Remediation Project Brief?"
    body: |
      <p>A mold remediation project brief is a standardized summary of visible mold conditions, the suspected moisture source, and any prior assessment or remediation work.</p>
      <p>It can include the location and approximate size of the affected area, moisture or water history, health concerns you want addressed, photos, and questions a remediation company should answer.</p>
      <p>The brief does not diagnose mold type, source, or health risk. In Texas, assessment and remediation are often performed by separately licensed companies.</p>

  - heading: "What Information Helps When Getting Mold Quotes?"
    body: |
      <p>Useful information includes where you see visible growth or smell a musty odor, the approximate square footage affected, whether there was a known leak, flood, or humidity problem, whether a professional has already tested the area, and any health concerns in the household.</p>
      <p>Photos of the affected area and its surroundings help a great deal.</p>

  - heading: "Compare What’s Included Before You Compare the Price."
    body: |
      <p>Mold remediation estimates can differ in containment method, air filtration, material removal versus cleaning, moisture-source repair, post-remediation verification, and warranty.</p>
      <p>A lower price that skips containment or post-remediation testing is not automatically the better deal.</p>

closingHeading: "Get the Mold Job Clear Before You Choose a Provider."
closingBody: >-
  Tell us what you’re seeing once. Get your Project Brief. Use it with
  a licensed assessor, a remediation company, or ask Texas Home Intelligence
  for optional help finding local pros.

faq:
  - q: "Does a QuoteReady Brief tell me if I have a mold problem?"
    a: "No. It organizes what you report so a licensed professional has clearer starting information. Confirming mold presence, type, or extent generally requires a licensed assessment or testing."
  - q: "Do I need a separate assessor and remediator in Texas?"
    a: "Often, yes. Texas licensing generally separates mold assessment from mold remediation to reduce conflicts of interest. Ask any provider which license they hold and how that affects your project."
  - q: "Can you use your Mold Brief with a company outside the Texas Home Intelligence network?"
    a: "Yes. Use it with any licensed provider you choose. Help finding local professionals is optional."
