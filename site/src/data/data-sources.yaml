- id: nws-api
  name: "NWS API"
  org: "National Weather Service"
  primaryUse: "Current forecast, observations, alerts"
  thiOutput: "Fast-changing weather context and derived heat/freeze/storm indicators"
  status: live
  priority: true

- id: noaa-climate
  name: "NOAA Climate Normals + Global Summary of the Month"
  org: "NOAA NCEI"
  primaryUse: "1991-2020 monthly cooling degree days, base 65F, plus recent monthly actuals"
  thiOutput: "Cooling demand in a typical year, per metro"
  status: live
  priority: false

- id: noaa-storm-events
  name: "NOAA Storm Events"
  org: "NOAA"
  primaryUse: "Hail, wind, tornado, severe event history"
  thiOutput: "Roof/storm exposure and event context"
  status: live
  priority: true

- id: fema-nfhl
  name: "FEMA / NFHL"
  org: "FEMA"
  primaryUse: "Flood hazard context"
  thiOutput: "Flood/water/mold context; do not overstate probability"
  status: live
  priority: false

- id: permit-trade-activity
  name: "Permit Trade Activity (by category and month)"
  org: "City of Austin (Socrata) / City of San Antonio (CKAN)"
  primaryUse: "Monthly permit counts per trade category, each row carrying the metro-native source values and how they were classified"
  thiOutput: "Permit activity and timing by trade, per city. Counts and trend only. Never a cost."
  status: live
  priority: false

- id: municipal-permits
  name: "Local Municipal Permit Feeds"
  org: "City of Austin (Socrata) / City of San Antonio (CKAN)"
  primaryUse: "Roof-related permits only — Austin by text match on work class and description, San Antonio by its Re-Roof permit type"
  thiOutput: "Roof-related permit counts and month-by-month timing. No cost figures: declared valuation is unusable in both cities."
  status: live
  priority: true

