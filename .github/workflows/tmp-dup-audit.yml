# TEMPORARY — Round 44, ruling 5. DELETE BEFORE THE ROUND ENDS.
#
# THIS OUTRANKS THE ROUND. Fort Worth's feed carries multiple rows per permit:
# 81,701 rows in the 13-month window are 73,342 distinct Permit_No, and one
# umbrella permit spans 1,024 rows. `permitTradeActivity.ts` counts ROWS — one
# `bump()` per row, with no permit-number dedupe anywhere in either metro's loop
# (San Antonio's loop does not even read a permit-number column, so it could not
# dedupe). So if Austin's or San Antonio's source does the same thing, every
# trade figure live on /austin/hvac/, /san-antonio/plumbing/, both roof-permit
# data pages and their CSVs is inflated by the duplication rate, and has been
# since Round 10.
#
# The question is purely empirical and it is asked here against the SAME feeds
# and the SAME windows the live fetchers use:
#
#   AUSTIN   data.austintexas.gov/resource/3syk-w9eu  (Socrata) — row count vs
#            distinct permit_number, over the trailing 13 months, and the worst
#            repeated permit numbers so the shape is visible.
#   SAN ANT. data.sanantonio.gov CKAN "PERMITS ISSUED" CSV — downloaded and
#            counted in full, because CKAN offers no aggregate endpoint. Picks
#            the resource the same way sanAntonioPermits.ts does: every name
#            matching /permits?\s*issued/i, then the latest last_modified (the
#            2026-08-24 fix for the frozen 2020-2024 archive).
#
# Both are read-only, both are free-tier, neither writes anything.
name: TEMPORARY duplicate-permit audit, Austin + San Antonio (Round 44)

on:
  push:
    branches: [claude/thi-v3-round44-fort-worth]
    paths: ['.github/workflows/tmp-dup-audit.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit for duplicate permit rows
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          mkdir -p tmp/dup
          python3 - <<'PY'
          import json, os, csv, io, re, collections, urllib.parse, urllib.request, datetime

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/dup'
          log = []
          F = {}

          def get(url, timeout=600, headers=None):
              h = {'User-Agent': UA}
              if headers: h.update(headers)
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  return getattr(e, 'code', 0), str(e).encode()

          # The window the live fetchers use: computeFetchWindow's 365-day
          # backfill. 13 months here so it lines up with the Fort Worth figures.
          until = datetime.datetime(2026, 10, 1)
          since = datetime.datetime(2025, 9, 1)
          SINCE_S = since.strftime('%Y-%m-%dT00:00:00')
          UNTIL_S = until.strftime('%Y-%m-%dT00:00:00')

          # ══ AUSTIN — Socrata ════════════════════════════════════════════════
          BASE = 'https://data.austintexas.gov/resource/3syk-w9eu.json'
          tok = os.environ.get('SOCRATA_APP_TOKEN') or ''
          hdr = {'X-App-Token': tok} if tok else None

          def soda(params, label):
              url = BASE + '?' + urllib.parse.urlencode(params)
              st, body = get(url, headers=hdr)
              log.append({'label': label, 'status': st, 'bytes': len(body)})
              if st != 200:
                  log.append({'label': label, 'body': body[:300].decode('utf-8', 'replace')})
                  return None
              try: return json.loads(body)
              except Exception as e:
                  log.append({'label': label, 'parse_error': str(e)})
                  return None

          WHERE = f"issue_date >= '{SINCE_S}' AND issue_date < '{UNTIL_S}'"
          d = soda({'$select': 'count(1) as n', '$where': WHERE}, 'austin-rows')
          F['austin_rows'] = int(d[0]['n']) if d else None
          d = soda({'$select': 'count(distinct permit_number) as n', '$where': WHERE},
                   'austin-distinct')
          F['austin_distinct_permit_number'] = int(d[0]['n']) if d and 'n' in d[0] else None
          # If count(distinct ...) is unsupported, fall back to grouping.
          if F['austin_distinct_permit_number'] is None:
              seen, off = set(), 0
              while True:
                  d = soda({'$select': 'permit_number', '$where': WHERE, '$group': 'permit_number',
                            '$limit': '50000', '$offset': str(off)}, f'austin-group-{off}')
                  if not d: break
                  seen |= {r.get('permit_number') for r in d}
                  if len(d) < 50000: break
                  off += 50000
                  if off > 400000: break
              F['austin_distinct_permit_number'] = len(seen)
              F['austin_distinct_method'] = 'group fallback'
          else:
              F['austin_distinct_method'] = 'count(distinct)'
          # The worst repeats, so the shape is visible rather than inferred.
          d = soda({'$select': 'permit_number, count(1) as n', '$where': WHERE,
                    '$group': 'permit_number', '$order': 'n DESC', '$limit': '20'},
                   'austin-top-repeats')
          F['austin_top_repeats'] = d or []
          # And the same question restricted to what the trade-activity fetcher
          # actually retains, which is the figure the pages render.
          d = soda({'$select': 'count(1) as n', '$where':
                    f"{WHERE} AND (upper(description) like '%ROOF%' OR upper(work_class) like '%ROOF%')"},
                   'austin-roof-rows')
          F['austin_roof_rows'] = int(d[0]['n']) if d else None
          d = soda({'$select': 'count(distinct permit_number) as n', '$where':
                    f"{WHERE} AND (upper(description) like '%ROOF%' OR upper(work_class) like '%ROOF%')"},
                   'austin-roof-distinct')
          F['austin_roof_distinct'] = int(d[0]['n']) if d and 'n' in d[0] else None

          # ══ SAN ANTONIO — CKAN CSV, picked the way the fetcher picks it ══════
          st, body = get('https://data.sanantonio.gov/api/3/action/package_show'
                         '?id=building-permits', timeout=300)
          log.append({'label': 'sa-package', 'status': st, 'bytes': len(body)})
          res_url = None
          if st == 200:
              try:
                  pkg = json.loads(body)
                  cands = [r for r in pkg['result']['resources']
                           if re.search(r'permits?\s*issued', r.get('name', ''), re.I)]
                  F['sa_resource_candidates'] = [
                      {'name': r.get('name'), 'last_modified': r.get('last_modified'),
                       'created': r.get('created'), 'format': r.get('format')} for r in cands]
                  cands.sort(key=lambda r: (r.get('last_modified') or r.get('created') or ''),
                             reverse=True)
                  if cands:
                      res_url = cands[0].get('url')
                      F['sa_resource_chosen'] = cands[0].get('name')
              except Exception as e:
                  F['sa_package_error'] = str(e)

          if res_url:
              st, body = get(res_url, timeout=900)
              log.append({'label': 'sa-csv', 'status': st, 'bytes': len(body)})
              if st == 200:
                  text = body.decode('utf-8', 'replace')
                  rdr = csv.DictReader(io.StringIO(text))
                  hdrs = rdr.fieldnames or []
                  F['sa_headers'] = hdrs
                  # The fetcher resolves these two; find them the same way.
                  def resolve(cands):
                      for c in cands:
                          for h in hdrs:
                              if h.strip().upper() == c: return h
                      return None
                  date_col = resolve(['DATE ISSUED', 'ISSUE DATE', 'ISSUED DATE'])
                  # A permit identifier — the thing the fetcher never reads.
                  id_col = resolve(['PERMIT #', 'PERMIT NUMBER', 'PERMIT_NO', 'PERMIT NO',
                                    'PERMIT', 'PERMITNUMBER', 'RECORD NUMBER', 'CASE NUMBER'])
                  F['sa_date_col'], F['sa_id_col'] = date_col, id_col
                  F['sa_id_col_candidates_present'] = [h for h in hdrs
                                                       if re.search(r'permit|record|case|number|#', h, re.I)]
                  total = inwin = 0
                  ids = collections.Counter()
                  no_id = 0
                  for row in rdr:
                      total += 1
                      raw = (row.get(date_col) or '') if date_col else ''
                      if not raw: continue
                      try:
                          dt = datetime.datetime.fromisoformat(raw.strip().replace('Z', ''))
                      except ValueError:
                          try: dt = datetime.datetime.strptime(raw.strip()[:10], '%m/%d/%Y')
                          except ValueError: continue
                      if not (since <= dt < until): continue
                      inwin += 1
                      if id_col:
                          v = (row.get(id_col) or '').strip()
                          if v: ids[v] += 1
                          else: no_id += 1
                  F['sa_rows_total'] = total
                  F['sa_rows_in_window'] = inwin
                  F['sa_distinct_ids_in_window'] = len(ids) if id_col else None
                  F['sa_rows_without_id'] = no_id
                  F['sa_top_repeats'] = ids.most_common(15) if id_col else None

          json.dump({'findings': F, 'log': log}, open(f'{OUT}/dup-audit.json', 'w'), indent=2)

          print('══ AUSTIN (Socrata 3syk-w9eu, 2025-09-01 .. 2026-10-01) ══')
          print('  rows                    ', F.get('austin_rows'))
          print('  distinct permit_number  ', F.get('austin_distinct_permit_number'),
                f"({F.get('austin_distinct_method')})")
          r, p = F.get('austin_rows'), F.get('austin_distinct_permit_number')
          if r and p: print(f'  duplication             {(1 - p / r) * 100:.2f}%')
          print('  roof-matched rows/distinct:', F.get('austin_roof_rows'), '/', F.get('austin_roof_distinct'))
          print('  top repeats:', (F.get('austin_top_repeats') or [])[:6])
          print()
          print('══ SAN ANTONIO (CKAN "PERMITS ISSUED") ══')
          print('  resource chosen         ', F.get('sa_resource_chosen'))
          print('  date col / id col       ', F.get('sa_date_col'), '/', F.get('sa_id_col'))
          print('  id-ish headers present  ', F.get('sa_id_col_candidates_present'))
          print('  rows total / in window  ', F.get('sa_rows_total'), '/', F.get('sa_rows_in_window'))
          print('  distinct ids in window  ', F.get('sa_distinct_ids_in_window'))
          print('  rows with no id         ', F.get('sa_rows_without_id'))
          sr, sp = F.get('sa_rows_in_window'), F.get('sa_distinct_ids_in_window')
          if sr and sp: print(f'  duplication             {(1 - sp / sr) * 100:.2f}%')
          print('  top repeats:', (F.get('sa_top_repeats') or [])[:6])
          print(f"\n{len(log)} requests; non-200: {[(x['label'], x['status']) for x in log if x.get('status') not in (200, None)][:5]}")
          PY
      - name: Commit findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/dup
          git commit -m "TEMPORARY: Round 44 duplicate-permit audit, Austin + San Antonio" || echo "nothing to commit"
          git push
