# TEMPORARY — Round 45, the full recount. DELETE BEFORE THE ROUND ENDS.
#
# The first run exposed a bigger problem than the one it fixed. With
# `computeFetchWindow`'s incremental window, the fixed fetcher recounted exactly
# ONE month (2026-09) and `mergeObservations` replaced only that key — leaving
# twelve months of row counts beside one month of permit counts, all under one
# `trades-v1` prefix with nothing marking the seam. San Antonio's electrical
# total moved 11,162 → 11,115, which reads as a −0.42% correction and is really
# −6.5% to one month and nothing to twelve. A mixture is worse than either basis.
#
# Three changes since, all in service of that:
#   · `recountWindow()` overrides the incremental window — this dataset is a
#     monthly aggregate recomputed from a whole file, not an append-only log.
#   · CATEGORY_MAPPING_VERSION → trades-v2, because the counting basis changed.
#   · `tradeActivity()` now reads ONLY the newest version on disk. The writing
#     half of that mechanism existed; the reading half did not, so the first bump
#     would have summed old and new rows for every recounted month.
#
# Also: Austin's work descriptions are now redacted at ingest, so this run is
# what makes the committed tree clean.
name: TEMPORARY Round 45 full recount

on:
  push:
    branches: [claude/thi-v3-round45-permit-counts]
    paths: ['.github/workflows/tmp-r45-reingest.yml']

permissions:
  contents: write

jobs:
  reingest:
    defaults:
      run:
        working-directory: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Ingest — full window, distinct permits, redacted descriptions
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: npm run ingest
      - name: Commit
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/src/data/generated
          git commit -m "Round 45: full-window recount under trades-v2, descriptions redacted" || echo "nothing to commit"
          git push
