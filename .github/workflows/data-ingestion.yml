name: Data ingestion

# Runs the ingestion pipeline (site/scripts/ingest.ts) on a schedule,
# commits whatever changed under site/src/data/generated/, and pushes.
#
# The site deploys as a Cloudflare WORKER via Wrangler, built by Git-connected
# Cloudflare Workers Builds (not Cloudflare Pages — see CLAUDE.md "Repo
# reality" and HANDOFF.md). This workflow does not build or deploy anything
# itself; the push to `main` is what Workers Builds picks up.
#
# That was the intent from the start, and until 2026-09-03 it did not work —
# see the commit step at the bottom of this file for why, and check a real
# Cloudflare version exists for a scheduled run before trusting it again.
# HANDOFF.md "Seam 1" covers what is still stubbed in the pipeline itself.
on:
  schedule:
    # Once a day, off-peak UTC. Every registered feed's `requiredEnvVars`
    # is checked before every real fetch attempt — until Seam 1's API
    # keys exist as repo secrets, every run safely no-ops into "sample
    # data preserved, nothing new" (see runIngestion.ts).
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Round 54: the description-shape detector raises a flag as an ISSUE, once per newly flagged
  # cell. An issue is addressed to a person, carries the investigation rather than a number, and
  # is de-duplicated by its own marker — see site/scripts/report-shape-flags.ts for why this
  # surface and not the dataset or the weekly Slack notice.
  issues: write

concurrency:
  group: data-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Run ingestion
        run: npm run ingest
        env:
          # Seam 1 (HANDOFF.md): populate these as repository secrets once
          # you have real keys. Every fetcher checks its own
          # `requiredEnvVars` before attempting a real call — a missing
          # var here fails that one feed's attempt without affecting any
          # other, and never fabricates a value.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}

      - name: Fetch current U.S. Drought Monitor Texas map
        run: npm run fetch-drought-map

      # ── ROUND 54: THE DESCRIPTION-SHAPE DETECTOR, SURFACED ─────────────────
      # Runs AFTER the ingest and BEFORE the commit, so the report describes the data this run
      # produced. It is NOT A GATE: `|| true` everywhere, `continue-on-error`, and no step here
      # can fail the ingestion. A detector that could stop the pipeline would be a gate nobody
      # asked for, and the owner's line is that nothing about this changes what publishes.
      - name: Description-shape detector — report
        id: shapeflags
        continue-on-error: true
        run: |
          npx tsx scripts/report-shape-flags.ts --json > /tmp/shape-flags.json || {
            echo "::warning::the shape-flag reporter failed; the ingest itself is unaffected"
            exit 0
          }
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/shape-flags.json", "utf8"));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, r.markdown);
            const n = r.unexplained.length;
            console.log(`unexplained flags: ${n}; evaluated ${r.evaluated}; near misses ${r.nearMisses}`);
            if (r.marginTighterThanRound53) {
              console.log("::warning::the shape detector margin is TIGHTER than when it was measured — re-measure before trusting a flag");
            }
            for (const f of r.unexplained) console.log(`::warning::${f.title}`);
          ' || true

      - name: Description-shape detector — raise each new flag once, as an issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s /tmp/shape-flags.json ] || exit 0
          # The label is created idempotently; a 422 for "already exists" is the normal case.
          gh api -X POST "repos/$GITHUB_REPOSITORY/labels" -f name=shape-flag \
            -f color=d4a72c -f description="A description-shape suspicion, not a finding" \
            >/dev/null 2>&1 || true
          # Every issue ever raised this way, open or closed, so a flag is raised ONCE EVER.
          gh api "repos/$GITHUB_REPOSITORY/issues?state=all&labels=shape-flag&per_page=100" \
            --jq '.[].body' > /tmp/shape-flag-issues.txt 2>/dev/null || : > /tmp/shape-flag-issues.txt
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("/tmp/shape-flags.json", "utf8"));
            const seen = fs.readFileSync("/tmp/shape-flag-issues.txt", "utf8");
            const fresh = r.unexplained.filter((f) => !seen.includes(f.marker));
            fs.writeFileSync("/tmp/shape-flag-new.json", JSON.stringify(fresh));
            console.log(`${fresh.length} of ${r.unexplained.length} flag(s) not yet raised`);
          ' || exit 0
          node -e '
            const fs = require("fs"), { execFileSync } = require("child_process");
            const fresh = JSON.parse(fs.readFileSync("/tmp/shape-flag-new.json", "utf8"));
            const report = JSON.parse(fs.readFileSync("/tmp/shape-flags.json", "utf8")).markdown;
            for (const f of fresh) {
              const body = `${f.marker}\n\n${report}`;
              fs.writeFileSync("/tmp/shape-flag-body.md", body);
              try {
                execFileSync("gh", ["api", "-X", "POST", `repos/${process.env.GITHUB_REPOSITORY}/issues`,
                  "-f", `title=${f.title}`, "-F", "body=@/tmp/shape-flag-body.md",
                  "-f", "labels[]=shape-flag"], { stdio: "inherit" });
              } catch (e) {
                console.log(`::warning::could not raise the flag for ${f.cell}: ${e.message}`);
              }
            }
          ' || true

      - name: Commit generated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/
          # fetch-drought-map.ts is non-fatal and may not have written
          # anything (e.g. no matching map found this run) -- `git add`
          # on a path with nothing to add errors out and would otherwise
          # abort this whole step, silently dropping the real dataset
          # commits above. Only add it if it actually exists.
          if [ -d public/images/drought ]; then
            git add public/images/drought/
          fi
          # Round 5b: the Austin Resource Recovery shards are the one feed whose
          # output does NOT live under src/data/generated/. Its DatasetFile
          # (the per-run summary) does, but the per-ZIP address tables are
          # written to public/ so they stay out of the build's module graph and
          # are only ever read one at a time through ASSETS. Without this they
          # would be regenerated on every run and thrown away, and the dashboard
          # would withhold forever. Guarded like the drought map above: `git add`
          # on a non-existent path aborts the whole step.
          if [ -d public/data/arr-schedule ]; then
            git add public/data/arr-schedule/
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # ── NO `[skip ci]` HERE. It is load-bearing that this stays out. ──
            #
            # `[skip ci]` is a GitHub Actions convention, but Cloudflare
            # Workers Builds honors it too — and that is what silently
            # suppressed the deployment of every ingestion commit this
            # workflow has ever made. The data was committed to `main` and
            # never built, so the live site kept serving whatever was baked in
            # at the last hand-authored merge while `main` accumulated fresh
            # readings nobody could see. No error, no failed build: the
            # Cloudflare build simply reported "skipped".
            #
            # Confirmed 2026-09-03 from build `2d70ac3` ("Data ingestion:
            # update generated datasets [skip ci]"), which shows status
            # skipped, and from Version History containing no version for any
            # ingestion commit — only merges and dashboard secret changes.
            #
            # Removing it is safe from a re-trigger standpoint: no workflow in
            # this repo has a `push` trigger (both are `schedule` +
            # `workflow_dispatch` only), and GitHub does not start workflows
            # from pushes made with the default GITHUB_TOKEN, which is what
            # the bare `git push` below uses. Two independent reasons, either
            # sufficient. If a `push` trigger is ever added to this repo,
            # re-check this before assuming it still holds.
            git commit -m "Data ingestion: update generated datasets"
            git push
          fi
