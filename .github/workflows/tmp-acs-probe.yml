# TEMPORARY — Round 42 probe. DELETE BEFORE THE ROUND ENDS.
#
# censusAcs.ts pins VINTAGE = 2023 with a standing TODO(owner) to bump it. Every
# ACS card on the site therefore renders OUT OF DATE against the 400-day
# freshness window. This asks three things, in order, and assumes none of them:
#
#   A · which ACS 5-year vintages the API actually serves for EACH of the six
#       geographies the site reads — four counties and two places. The newest
#       vintage existing is not the same as it existing for a small place.
#   B · whether B25035_001E, B25003_001E and B25003_002E mean the same thing in
#       the newer vintage. A variable that was redefined without being renamed
#       is the real risk here, and it would move published numbers silently.
#   C · the actual values at every vintage, so the before/after deltas are
#       measured rather than predicted.
#
# Robots guard carried from Round 39, with both Round 41c corrections.
name: TEMPORARY ACS vintage probe (Round 42)

on:
  push:
    branches: [claude/thi-v3-round42-acs-vintage]
    paths: ['.github/workflows/tmp-acs-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe ACS vintages
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          mkdir -p tmp/acs/robots
          python3 - <<'PY'
          import json, os, re, math, csv, io, urllib.parse, urllib.request, collections

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/acs'
          log = []
          def get(url, timeout=90):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  code = getattr(e, 'code', 0)
                  return code, str(e).encode()

          # ---- robots: parse the User-agent: * group properly ----
          robots_cache = {}
          def star_rules(host):
              if host in robots_cache: return robots_cache[host]
              st, body = get(f'https://{host}/robots.txt', timeout=30)
              txt = body.decode('utf-8', 'replace') if st == 200 else ''
              open(f'{OUT}/robots/{host}.txt', 'w').write(txt if st == 200 else f'(HTTP {st})')
              groups, cur, agents = [], None, []
              for line in txt.splitlines():
                  l = line.split('#')[0].strip()
                  # ⚠️ A BLANK LINE ENDS A GROUP (RFC 9309 §2.2.1). Pass 1 skipped
                  # blank lines, so on www2.census.gov — which opens with a bare
                  # `User-agent: *` and no rules, then a blank line, then
                  # `User-agent: RavenCrawler` / `Disallow: /` — it merged the two
                  # and refused the whole host to everyone. A guard that errs
                  # toward refusing still produces a false finding.
                  if not l:
                      # UNCONDITIONALLY, even with no rules. Pass 2 kept the
                      # `and cur['rules']` guard here and so changed nothing:
                      # `User-agent: *` with an empty rule set is still a
                      # complete group, and leaving it open let the next
                      # `User-agent:` line join it. That guard belongs only on
                      # the user-agent branch, where CONSECUTIVE agent lines do
                      # legitimately share one group.
                      if cur is not None:
                          groups.append(cur)
                          cur = None
                      continue
                  k, _, v = l.partition(':')
                  k, v = k.strip().lower(), v.strip()
                  if k == 'user-agent':
                      if cur is not None and cur['rules']:
                          groups.append(cur); cur = None
                      if cur is None: cur = {'agents': [], 'rules': []}
                      cur['agents'].append(v)
                  elif cur is not None and k in ('allow', 'disallow'):
                      cur['rules'].append((k, v))
              if cur is not None: groups.append(cur)
              dis = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'disallow' and v]
              allow = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'allow' and v]
              robots_cache[host] = (st, dis, allow)
              return robots_cache[host]

          def match(rule, path):
              pat = re.escape(rule).replace(r'\*', '.*')
              if pat.endswith(r'\$'): return re.match('^' + pat[:-2] + '$', path) is not None
              return re.match('^' + pat, path) is not None

          def allowed(url):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              # Path AND query. Round 39 pass 4: Dallas' rules were query-scoped
              # (`Disallow: /browse?*&q=`) and a path-only match ignored them all.
              path = (u.path or '/') + (f'?{u.query}' if u.query else '')
              d = [r for r in dis if match(r, path)]
              a = [r for r in allow if match(r, path)]
              # longest-match wins; Allow beats Disallow at equal length
              if d and (not a or max(len(x) for x in a) < max(len(x) for x in d)):
                  return False, d
              return True, []

          def fetch(url, label):
              ok, why = allowed(url)
              if not ok:
                  log.append({'url': url, 'label': label, 'status': 'SKIPPED_BY_ROBOTS', 'disallowed_by': why})
                  return None
              st, body = get(url)
              log.append({'url': url, 'label': label, 'status': st, 'bytes': len(body)})
              return body if st == 200 else None

          def jparse(b, label):
              try:
                  return json.loads(b), None
              except Exception as e:
                  return None, {'parse_error': str(e), 'body_prefix': b[:200].decode('utf-8', 'replace')}

          KEY = os.environ.get('CENSUS_API_KEY', '')
          VARS = ['B25035_001E', 'B25003_001E', 'B25003_002E']
          # Exactly the six the site reads. Counties are `for=county:NNN`,
          # places `for=place:NNNNN`, both `in=state:48`.
          GEOS = [
              ('Travis County',      'county:453'),
              ('Bexar County',       'county:029'),
              ('Comal County',       'county:091'),
              ('Hays County',        'county:209'),
              ('New Braunfels city', 'place:50820'),
              ('San Marcos city',    'place:65600'),
          ]
          # 2023 is the current pin. 2022 is a control: if it answers and the
          # newer ones do not, the API is fine and the vintage simply is not out.
          VINTAGES = ['2022', '2023', '2024', '2025']

          F = collections.defaultdict(dict)

          # ── A · which vintages exist at all ──────────────────────────────
          for v in VINTAGES:
              b = fetch(f'https://api.census.gov/data/{v}/acs/acs5.json', f'dataset:{v}')
              if b is None:
                  F['dataset_exists'][v] = 'no 200'
                  continue
              d, err = jparse(b, 'ds')
              F['dataset_exists'][v] = err or {
                  'title': (d or {}).get('title'),
                  'modified': (d or {}).get('modified'),
                  'c_vintage': (d or {}).get('c_vintage'),
              }

          # ── B · do the variables mean the same thing? ────────────────────
          for v in VINTAGES:
              for var in VARS:
                  b = fetch(f'https://api.census.gov/data/{v}/acs/acs5/variables/{var}.json',
                            f'var:{v}:{var}')
                  if b is None:
                      F['variables'][f'{v}/{var}'] = 'no 200'
                      continue
                  d, err = jparse(b, 'var')
                  F['variables'][f'{v}/{var}'] = err or {
                      'label': (d or {}).get('label'),
                      'concept': (d or {}).get('concept'),
                      'group': (d or {}).get('group'),
                      'predicateType': (d or {}).get('predicateType'),
                  }

          # ── A+C · per geography, per vintage: served? and with what values ─
          for label, forclause in GEOS:
              for v in VINTAGES:
                  u = (f'https://api.census.gov/data/{v}/acs/acs5'
                       f'?get=NAME,{",".join(VARS)}&for={urllib.parse.quote(forclause)}'
                       f'&in=state:48')
                  if KEY: u += f'&key={KEY}'
                  b = fetch(u, f'value:{label}:{v}')
                  if b is None:
                      F['values'][f'{label} @ {v}'] = {'served': False, 'why': 'no 200'}
                      continue
                  d, err = jparse(b, 'val')
                  if err:
                      F['values'][f'{label} @ {v}'] = {'served': False, 'why': err}
                      continue
                  if not isinstance(d, list) or len(d) < 2:
                      F['values'][f'{label} @ {v}'] = {'served': False, 'why': 'no data row'}
                      continue
                  header, row = d[0], d[1]
                  col = {h: row[i] for i, h in enumerate(header)}
                  yb = col.get('B25035_001E')
                  tot = col.get('B25003_001E')
                  own = col.get('B25003_002E')
                  def num(x):
                      try:
                          n = float(x)
                          return n if n > -666666000 else None
                      except (TypeError, ValueError):
                          return None
                  ybn, totn, ownn = num(yb), num(tot), num(own)
                  F['values'][f'{label} @ {v}'] = {
                      'served': True,
                      'NAME': col.get('NAME'),
                      'medianYearBuilt': ybn,
                      'totalUnits': totn,
                      'ownerUnits': ownn,
                      # The two figures the site actually publishes, computed
                      # exactly as censusAcs.ts computes them.
                      'ownerOccupiedPct': round(ownn / totn * 1000) / 10
                                          if (ownn is not None and totn) else None,
                      'raw': {'B25035_001E': yb, 'B25003_001E': tot, 'B25003_002E': own},
                  }

          json.dump({'findings': F, 'log': log}, open(f'{OUT}/probe-1.json', 'w'), indent=2)
          print('── dataset availability ──')
          for v, r in F['dataset_exists'].items():
              print(f'  {v}: {r if isinstance(r, str) else r.get("title")}')
          print('\n── served per geography ──')
          for k, r in F['values'].items():
              print(f'  {"YES" if r.get("served") else "no ":3s}  {k}')
          print(f'\n{len(log)} requests; skipped by robots: '
                f'{sum(1 for x in log if x["status"] == "SKIPPED_BY_ROBOTS")}')
          PY
      - name: Commit findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/acs
          git commit -m "TEMPORARY: Round 42 ACS vintage probe findings" || echo "nothing to commit"
          git push
