# TEMPORARY — Round 54. Delete when the round is decided.
#
# No external host is reachable from an agent session, and Actions logs are served from a host it
# cannot follow a redirect to — so the probe WRITES AND COMMITS its measurement. Read-only on the
# datasets: a step below fails the run if anything under src/data/generated moved.
#
# VERIFICATION. Round 54 wired the detector into the ingest; this runs the real
# `permitTradeActivityAustin.fetchRaw` against the live source on a runner and writes down what
# came back — the flags, the near misses, the margin, and whether the stored verdicts equal a
# fresh evaluation. It writes no dataset: a step below fails the run if one moved.
name: tmp r54 detector live-path verification

on:
  push:
    branches: [claude/thi-plan-review-m40n0x]
    paths:
      - "site/scripts/audits/round-54-detector-live.ts"
      - ".github/workflows/tmp-r54-fingerprint-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      - name: Run the real ingest path and read the detector output
        working-directory: site
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npx tsx scripts/audits/round-54-detector-live.ts

      - name: The probe must not have written a dataset file
        run: |
          if ! git diff --quiet -- site/src/data/generated; then
            echo "::error::the probe modified site/src/data/generated — it is read-only by design"
            exit 1
          fi

      - name: No permit description may appear in the measurement
        # The standing line from Round 50: a probe writes the measurement, not the material.
        #
        # INVERTED, after the first run of this workflow failed on its own prose. The earlier
        # guard flagged any long, spacey string outside `$.notes.*`, and the detector's output
        # carries sentences by design — a flag's `nextStep`, the near-miss explanations, the
        # reach. Those are literals from `src/lib/shapeFlags.ts` with numbers interpolated, not
        # anything read from the source.
        #
        # So instead of hunting for bad strings, this ALLOWS a named set of prose paths and
        # requires every other string in the file to be short and plain. A new free-text field
        # anywhere else fails the run, which is the direction that cannot fail open: forgetting
        # to add a path to the list breaks the build, while forgetting to exclude one would
        # have published it.
        #
        # It reports the JSON PATH of any offender and never the offending text, and writes the
        # result to a file that gets committed whether or not the check passes — an Actions log
        # this session cannot read is not a record.
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          SRC = pathlib.Path("docs/audits/round-54-detector-live.json")
          if not SRC.exists():
              print("no measurement written; nothing to check"); sys.exit(0)

          # Paths whose value is a SENTENCE WRITTEN IN THE SOURCE, with only numbers and
          # category/month names interpolated. Each one is a literal in shapeFlags.ts or in
          # scripts/audits/round-54-detector-live.ts.
          PROSE = {
              "$.flagLines[*]",
              "$.flags[*].nextStep",
              "$.nearMisses[*].declined",
              "$.margin.note",
              "$.margin.round53.measuredOn",
              "$.round53.measuredOn",
              "$.reach.sanAntonio",
              "$.reach.detectsOnly",
              "$.reach.blindSpotMeasured",
              "$.reach.earliest",
          }
          PROSE_PREFIXES = ("$.notes.",)
          # Everything else: a category, a month, a cell id, an enum, a timestamp, a short note.
          DATA = re.compile(r"^[A-Za-z0-9 ._/:+×−@()'-]{0,64}$")

          def norm(path):
              return re.sub(r"\[\d+\]", "[*]", path)

          def offenders(o, path="$", found=None):
              """Walks the STRUCTURE rather than regexing the serialised JSON — Round 50's first
              guard regexed the text and produced a false positive on its own punctuation."""
              found = [] if found is None else found
              if isinstance(o, dict):
                  for k, v in o.items():
                      if isinstance(k, str) and not DATA.match(k):
                          found.append({"path": f"{norm(path)}.<key>", "length": len(k)})
                      offenders(v, f"{path}.{k}", found)
              elif isinstance(o, list):
                  for i, v in enumerate(o):
                      offenders(v, f"{path}[{i}]", found)
              elif isinstance(o, str):
                  n = norm(path)
                  if n in PROSE or n.startswith(PROSE_PREFIXES):
                      return found
                  if not DATA.match(o):
                      found.append({"path": n, "length": len(o), "spaces": o.count(" ")})
              return found

          measurement = json.loads(SRC.read_text())
          hits = offenders(measurement)

          # NON-VACUITY. A guard that has never fired is a guard nobody has checked, and this
          # one is the round's design constraint. Planted at a DATA path, which is where a
          # description would actually leak: a field somebody added to a cell.
          PLANTED_AT = "$.cells[*].plantedForTheGuard"
          planted = json.loads(SRC.read_text())
          planted["cells"][0]["plantedForTheGuard"] = (
              "INSTALL BATTERY BACKUP SYSTEM AND ADDITIONAL METER SOCKET AT SINGLE FAMILY RESIDENCE"
          )
          can_fire = any(h["path"] == PLANTED_AT for h in offenders(planted))

          pathlib.Path("docs/audits/round-54-textcheck.json").write_text(
              json.dumps({
                  "offenders": hits,
                  "guardCanFire": can_fire,
                  "plantedOffenderPath": PLANTED_AT if can_fire else None,
                  "prosePathsAllowed": sorted(PROSE) + [p + "*" for p in PROSE_PREFIXES],
                  "note": "paths and shapes only; the matched text is deliberately absent. Every "
                          "string outside the listed prose paths must be <=64 plain characters, so "
                          "a NEW free-text field anywhere else fails this check. `guardCanFire` is "
                          "this same guard run against the measurement with one "
                          "description-shaped string planted at a data path.",
              }, indent=2) + "\n")
          for h in hits[:10]:
              print("  offender:", h)
          print(f"{len(hits)} offender(s); guard can fire: {can_fire}")
          sys.exit(0 if (not hits and can_fire) else 1)
          PY

      - name: Commit the measurement
        if: always()
        run: |
          git config user.name  "thi-probe"
          git config user.email "noreply@texashomeintelligence.com"
          git add docs/audits/round-54-detector-live.json docs/audits/round-54-textcheck.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Round 54 probe result: the per-month description fingerprint, every Austin category

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          for i in 1 2 3 4; do git push origin HEAD:${GITHUB_REF_NAME} && break || sleep $((2**i)); done
