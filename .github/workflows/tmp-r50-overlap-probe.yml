# TEMPORARY — Round 50. Delete when the round lands.
#
# No external host is reachable from a Claude Code session, and Actions logs are served from a
# host this session cannot follow a redirect to. So the probe WRITES AND COMMITS its measurement
# rather than printing it: a measurement that only prints is not a record (Round 49).
name: tmp r50 permit-overlap probe

on:
  push:
    branches: [claude/thi-plan-review-m40n0x]
    paths:
      - "site/scripts/audits/round-50-permit-overlap-probe.ts"
      - "site/scripts/audits/round-50-aux-power-vocabulary.ts"
      - ".github/workflows/tmp-r50-overlap-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      - name: Measure the overlap, against both cities' real feeds
        working-directory: site
        env:
          # Optional for Austin's Socrata endpoint — raises the rate limit, changes no result.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npx tsx scripts/audits/round-50-permit-overlap-probe.ts

      - name: What the Auxiliary Power descriptions actually say
        working-directory: site
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npx tsx scripts/audits/round-50-aux-power-vocabulary.ts

      - name: The probe must not have written a dataset file
        # It measures. If it ever starts writing what the site serves, that is a different
        # thing wearing this one's name.
        run: |
          if ! git diff --quiet -- site/src/data/generated; then
            echo "::error::the probe modified site/src/data/generated — it is read-only by design"
            git --no-pager diff --stat -- site/src/data/generated
            exit 1
          fi

      - name: Commit the measurement
        run: |
          git config user.name  "thi-probe"
          git config user.email "noreply@texashomeintelligence.com"
          git add docs/audits/round-50-probe.json docs/audits/round-50-aux-vocabulary.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Round 50 probe result: measured permit-category overlap

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          for i in 1 2 3 4; do git push origin HEAD:${GITHUB_REF_NAME} && break || sleep $((2**i)); done
