# TEMPORARY — Round 37 crime probe. DELETE THIS FILE BEFORE THE ROUND ENDS.
#
# No external host is reachable from a Claude Code session (BACKLOG standing
# note), so this is the "temporary Actions workflow" shape: it runs on a
# GitHub runner, fetches raw samples, and commits them to a clearly temporary
# path for measurement. It writes nothing under site/src/data/ and is not part
# of the ingestion pipeline.
#
# It is push-triggered on the probe branch alone, and only when this file
# itself changes, so it cannot fire from ordinary work and needs nothing on
# main. It reads public APIs only: Socrata's documented catalog and resource
# endpoints, and ArcGIS Hub's search API. robots.txt and each dataset's own
# licence metadata are fetched FIRST and saved, because whether the terms
# permit anything is the question that can end this round.
name: TEMPORARY crime probe (Round 37)

on:
  push:
    branches: [claude/thi-v3-round37-crime-probe]
    paths: ['.github/workflows/tmp-crime-probe.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch samples
        run: |
          set -u
          OUT=tmp/crime-probe
          mkdir -p "$OUT/austin" "$OUT/san-antonio" "$OUT/meta"
          LOG="$OUT/meta/fetch-log-3.txt"
          : > "$LOG"
          note () { echo "$*" | tee -a "$LOG"; }
          get () {
            local url="$1" dest="$2" code
            code=$(curl -sS -L --max-time 300 -w '%{http_code}' -o "$dest" \
                     -A 'TexasHomeIntelligence-probe/1.0 (one-off research fetch)' "$url" || echo "000")
            note "$code  $(wc -c < "$dest" 2>/dev/null || echo 0) bytes  $url"
            [ "$code" = "200" ]
          }

          # PASS 2 FINDING this pass corrects: the Austin sample came back as
          # the OLDEST 2,000 rows (Jan 2003), because Socrata's default order is
          # unspecified. Field-population rates measured on 2003 rows say
          # nothing about what is published now, which is the only thing a
          # reading or an article could use. Re-fetched newest-first.
          note "=== Austin · RECENT rows, newest reported first ==="
          get "https://data.austintexas.gov/resource/fdj4-gpfu.json?\$order=rep_date%20DESC&\$limit=5000" \
              "$OUT/austin/fdj4-gpfu.recent.json" || true
          note "=== Austin · a full recent year, counted by the API rather than downloaded ==="
          get "https://data.austintexas.gov/resource/fdj4-gpfu.json?\$select=count(1)&\$where=rep_date%3E%272025-09-01T00:00:00%27" \
              "$OUT/austin/count-since-2025-09.json" || true
          note "=== Austin · how much of the recent record carries each geography ==="
          for f in census_block_group council_district sector district; do
            get "https://data.austintexas.gov/resource/fdj4-gpfu.json?\$select=count(1)&\$where=rep_date%3E%272025-09-01T00:00:00%27%20AND%20${f}%20IS%20NOT%20NULL" \
                "$OUT/austin/count-$f.json" || true
          done

          note ""
          note "=== San Antonio · SAPD Offenses (CKAN, CC-Attribution) ==="
          get "https://data.sanantonio.gov/api/3/action/package_show?id=sapd-offenses" \
              "$OUT/san-antonio/sapd-offenses.package.json" || true
          URL=$(jq -r '[.result.resources[] | select(.format=="CSV")][0].url' \
                "$OUT/san-antonio/sapd-offenses.package.json" 2>/dev/null || echo "")
          note "resource url: ${URL:-NONE}"
          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            get "$URL" "$OUT/san-antonio/sapd-offenses.csv" || true
            # Keep only a bounded slice in the repo; record the true size first.
            if [ -f "$OUT/san-antonio/sapd-offenses.csv" ]; then
              note "full CSV: $(wc -l < "$OUT/san-antonio/sapd-offenses.csv") lines, $(wc -c < "$OUT/san-antonio/sapd-offenses.csv") bytes"
              head -n 5001 "$OUT/san-antonio/sapd-offenses.csv" > "$OUT/san-antonio/sapd-offenses.head.csv"
              tail -n 5000 "$OUT/san-antonio/sapd-offenses.csv" > "$OUT/san-antonio/sapd-offenses.tail.csv"
              rm -f "$OUT/san-antonio/sapd-offenses.csv"
            fi
          fi
          note "=== San Antonio · the data-preparation PDF (its own description of the fields) ==="
          PDF=$(jq -r '[.result.resources[] | select(.format=="PDF")][0].url' \
                "$OUT/san-antonio/sapd-offenses.package.json" 2>/dev/null || echo "")
          [ -n "$PDF" ] && [ "$PDF" != "null" ] && get "$PDF" "$OUT/san-antonio/offenses-data-preparation.pdf" || true

          note ""
          note "=== what landed ==="
          find "$OUT" -type f | sort | while read -r f; do note "$(wc -c < "$f") bytes  $f"; done

      - name: Commit samples
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/crime-probe
          git commit -m "TEMPORARY: Round 37 crime probe samples (delete with the workflow)" || echo "nothing to commit"
          git push
