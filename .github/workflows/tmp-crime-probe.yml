# TEMPORARY — Round 37 crime probe. DELETE THIS FILE BEFORE THE ROUND ENDS.
#
# No external host is reachable from a Claude Code session (BACKLOG standing
# note), so this is the "temporary Actions workflow" shape: it runs on a
# GitHub runner, fetches raw samples, and commits them to a clearly temporary
# path for measurement. It writes nothing under site/src/data/ and is not part
# of the ingestion pipeline.
#
# It is push-triggered on the probe branch alone, and only when this file
# itself changes, so it cannot fire from ordinary work and needs nothing on
# main. It reads public APIs only: Socrata's documented catalog and resource
# endpoints, and ArcGIS Hub's search API. robots.txt and each dataset's own
# licence metadata are fetched FIRST and saved, because whether the terms
# permit anything is the question that can end this round.
name: TEMPORARY crime probe (Round 37)

on:
  push:
    branches: [claude/thi-v3-round37-crime-probe]
    paths: ['.github/workflows/tmp-crime-probe.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch samples
        run: |
          set -u
          OUT=tmp/crime-probe
          mkdir -p "$OUT/austin" "$OUT/san-antonio" "$OUT/meta"
          LOG="$OUT/meta/fetch-log-2.txt"
          : > "$LOG"
          note () { echo "$*" | tee -a "$LOG"; }
          get () {
            local url="$1" dest="$2" code
            code=$(curl -sS -L --max-time 120 -w '%{http_code}' -o "$dest" \
                     -H 'Accept: application/json' \
                     -A 'TexasHomeIntelligence-probe/1.0 (one-off research fetch)' \
                     "$url" || echo "000")
            note "$code  $(wc -c < "$dest" 2>/dev/null || echo 0) bytes  $url"
            [ "$code" = "200" ]
          }

          # PASS 1 FINDINGS this pass corrects:
          #  - the Socrata catalog returned 0 results for "crime" on Austin's
          #    domain, so search the portal's OWN catalogue and several terms;
          #  - data.sanantonio.gov is CKAN, not Socrata ("Domain not found"),
          #    which is why it 404'd. THI's own permit fetcher already uses its
          #    /api/3/action/ endpoints.
          note "=== Austin · Socrata, portal's own catalogue, several terms ==="
          for q in crime incident police offense arrest; do
            get "https://data.austintexas.gov/api/catalog/v1?q=$q&limit=60" \
                "$OUT/meta/austin-catalog-$q.json" || true
          done
          note ""
          note "=== Austin · the dataset the APD crime reports are published as ==="
          for id in fdj4-gpfu; do
            get "https://data.austintexas.gov/api/views/$id.json" "$OUT/austin/$id.meta.json" || true
            get "https://data.austintexas.gov/resource/$id.json?\$limit=2000" "$OUT/austin/$id.sample.json" || true
          done

          note ""
          note "=== San Antonio · CKAN package search ==="
          for q in crime incident police offense sapd; do
            get "https://data.sanantonio.gov/api/3/action/package_search?q=$q&rows=40" \
                "$OUT/meta/sa-ckan-$q.json" || true
          done

          note ""
          note "=== San Antonio · ArcGIS Hub, broader terms ==="
          for q in incident police sapd offense; do
            get "https://opendata-cosagis.opendata.arcgis.com/api/search/v1/collections/dataset/items?q=$q&limit=50" \
                "$OUT/meta/arcgis-$q.json" || true
          done

          note ""
          note "=== what landed ==="
          find "$OUT" -type f | sort | while read -r f; do
            note "$(wc -c < "$f") bytes  $f"
          done

      - name: Commit samples
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/crime-probe
          git commit -m "TEMPORARY: Round 37 crime probe samples (delete with the workflow)" || echo "nothing to commit"
          git push
