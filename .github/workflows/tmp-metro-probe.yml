# TEMPORARY — Round 39 metro probe. DELETE BEFORE THE ROUND ENDS.
#
# ROBOTS COMPLIANCE IS ENFORCED IN CODE, NOT PROMISED. Round 37's probe said it
# had respected robots.txt and had not: it skimmed the first dozen Disallow
# lines and missed `Disallow: /api/` in San Antonio's `User-agent: *` group.
# So this fetches every robots.txt FIRST, parses the `*` group properly, and
# refuses any path that group disallows — recording the refusal as a finding
# rather than fetching anyway.
#
# Commits a small findings JSON and the robots files. No bulk rows.
name: TEMPORARY metro probe (Round 39)

on:
  push:
    branches: [claude/thi-v3-round39-metro-probe]
    paths: ['.github/workflows/tmp-metro-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate metros
        run: |
          mkdir -p tmp/metro/robots
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, collections

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/metro'
          log = []

          def get(url, timeout=90):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  code = getattr(e, 'code', 0)
                  return code, str(e).encode()

          # ---- robots: parse the User-agent: * group properly ----
          robots_cache = {}
          def star_rules(host):
              if host in robots_cache: return robots_cache[host]
              st, body = get(f'https://{host}/robots.txt', timeout=30)
              txt = body.decode('utf-8', 'replace') if st == 200 else ''
              open(f'{OUT}/robots/{host}.txt', 'w').write(txt if st == 200 else f'(HTTP {st})')
              groups, cur, agents = [], None, []
              for line in txt.splitlines():
                  l = line.split('#')[0].strip()
                  if not l: continue
                  k, _, v = l.partition(':')
                  k, v = k.strip().lower(), v.strip()
                  if k == 'user-agent':
                      if cur is not None and cur['rules']:
                          groups.append(cur); cur = None
                      if cur is None: cur = {'agents': [], 'rules': []}
                      cur['agents'].append(v)
                  elif cur is not None and k in ('allow', 'disallow'):
                      cur['rules'].append((k, v))
              if cur is not None: groups.append(cur)
              dis = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'disallow' and v]
              allow = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'allow' and v]
              robots_cache[host] = (st, dis, allow)
              return robots_cache[host]

          def match(rule, path):
              pat = re.escape(rule).replace(r'\*', '.*')
              if pat.endswith(r'\$'): return re.match('^' + pat[:-2] + '$', path) is not None
              return re.match('^' + pat, path) is not None

          def allowed(url):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              path = u.path or '/'
              d = [r for r in dis if match(r, path)]
              a = [r for r in allow if match(r, path)]
              # longest-match wins; Allow beats Disallow at equal length
              if d and (not a or max(len(x) for x in a) < max(len(x) for x in d)):
                  return False, d
              return True, []

          def fetch(url, label):
              ok, why = allowed(url)
              if not ok:
                  log.append({'url': url, 'label': label, 'status': 'SKIPPED_BY_ROBOTS', 'disallowed_by': why})
                  return None
              st, body = get(url)
              log.append({'url': url, 'label': label, 'status': st, 'bytes': len(body)})
              return body if st == 200 else None

          # ---- PASS 2: the three candidates that showed real permit datasets ----
          # Pass 1's cross-domain search was noisy (Chicago, Calgary, Howard
          # County MD all matched "building permits"). Only three hits sat on a
          # Texas city's own domain. This asks those domains directly, and asks
          # Houston's own catalogue, which the global search never surfaced.
          findings = {'datasets': {}, 'houston_catalogue': None, 'corridor': {}, 'city_domains': {}}

          DATASETS = [
              ('Dallas', 'www.dallasopendata.com', 'e7gq-4sah', 'Building Permits'),
              ('Fort Worth', 'data.fortworthtexas.gov', 'quz7-xnsy', 'Development Permits'),
          ]
          for city, host, did, label in DATASETS:
              rec = {'host': host, 'id': did, 'label': label}
              b = fetch(f'https://{host}/api/views/{did}.json', f'meta:{city}')
              if b:
                  try:
                      m = json.loads(b)
                      rec['license'] = m.get('license')
                      rec['licenseId'] = m.get('licenseId')
                      rec['attribution'] = m.get('attribution')
                      rec['custom'] = (m.get('metadata') or {}).get('custom_fields')
                      rec['columns'] = [{'field': c.get('fieldName'), 'type': c.get('dataTypeName'),
                                         'name': c.get('name')} for c in m.get('columns', [])]
                      rec['rowsUpdatedAt'] = m.get('rowsUpdatedAt')
                  except Exception as e:
                      rec['meta_error'] = str(e)
              # Counts, not rows: cheap, and the whole record rather than a sample.
              b = fetch(f'https://{host}/resource/{did}.json?$select=count(1)', f'count:{city}')
              if b: rec['total_rows'] = json.loads(b)
              findings['datasets'][city] = rec

          # Houston: ask its own portal, since the cross-domain search found nothing there.
          b = fetch('https://data.houstontx.gov/api/catalog/v1?q=permit&limit=40', 'houston-catalogue')
          if b:
              try:
                  d = json.loads(b)
                  findings['houston_catalogue'] = {
                      'result_count': d.get('resultSetSize'),
                      'results': [{'name': r['resource']['name'], 'id': r['resource']['id'],
                                   'type': r['resource'].get('type')} for r in d.get('results', [])[:15]]}
              except Exception as e:
                  findings['houston_catalogue'] = f'parse error: {e}'

          # Corridor cities: one look each for an open-data portal, then move on.
          for city, hosts in [
              ('New Braunfels', ['data.newbraunfels.gov', 'newbraunfels-nbtexas.opendata.arcgis.com']),
              ('San Marcos', ['opendata-sanmarcostx.hub.arcgis.com', 'gis-sanmarcostx.opendata.arcgis.com']),
              ('Round Rock', ['data.roundrocktexas.gov', 'roundrock-rrtx.opendata.arcgis.com']),
              ('Kyle', ['data.cityofkyle.com', 'opendata-cityofkyle.hub.arcgis.com']),
          ]:
              out = {}
              for h in hosts:
                  st, dis, allow = star_rules(h)
                  out[h] = {'robots_http': st}
              findings['corridor'][city] = out

          for host in ['data.houstontx.gov', 'www.dallasopendata.com', 'data.fortworthtexas.gov']:
              st, dis, allow = star_rules(host)
              findings['city_domains'][host] = {'robots_http': st, 'star_disallow_count': len(dis),
                                                'star_disallow_sample': dis[:14]}

          json.dump({'findings': findings, 'log': log}, open(f'{OUT}/probe-2.json', 'w'), indent=2)
          print(json.dumps(findings['city_domains'], indent=2))
          print(f'\n{len(log)} requests; skipped by robots: '
                f'{sum(1 for x in log if x["status"] == "SKIPPED_BY_ROBOTS")}')
          PY
      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/metro
          git commit -m "TEMPORARY: Round 39 metro probe findings" || echo "nothing to commit"
          git push
