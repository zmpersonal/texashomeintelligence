# TEMPORARY — Round 39 metro probe. DELETE BEFORE THE ROUND ENDS.
#
# ROBOTS COMPLIANCE IS ENFORCED IN CODE, NOT PROMISED. Round 37's probe said it
# had respected robots.txt and had not: it skimmed the first dozen Disallow
# lines and missed `Disallow: /api/` in San Antonio's `User-agent: *` group.
# So this fetches every robots.txt FIRST, parses the `*` group properly, and
# refuses any path that group disallows — recording the refusal as a finding
# rather than fetching anyway.
#
# Commits a small findings JSON and the robots files. No bulk rows.
name: TEMPORARY metro probe (Round 39)

on:
  push:
    branches: [claude/thi-v3-round39-metro-probe]
    paths: ['.github/workflows/tmp-metro-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate metros
        run: |
          mkdir -p tmp/metro/robots
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, collections

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/metro'
          log = []

          def get(url, timeout=90):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  code = getattr(e, 'code', 0)
                  return code, str(e).encode()

          # ---- robots: parse the User-agent: * group properly ----
          robots_cache = {}
          def star_rules(host):
              if host in robots_cache: return robots_cache[host]
              st, body = get(f'https://{host}/robots.txt', timeout=30)
              txt = body.decode('utf-8', 'replace') if st == 200 else ''
              open(f'{OUT}/robots/{host}.txt', 'w').write(txt if st == 200 else f'(HTTP {st})')
              groups, cur, agents = [], None, []
              for line in txt.splitlines():
                  l = line.split('#')[0].strip()
                  if not l: continue
                  k, _, v = l.partition(':')
                  k, v = k.strip().lower(), v.strip()
                  if k == 'user-agent':
                      if cur is not None and cur['rules']:
                          groups.append(cur); cur = None
                      if cur is None: cur = {'agents': [], 'rules': []}
                      cur['agents'].append(v)
                  elif cur is not None and k in ('allow', 'disallow'):
                      cur['rules'].append((k, v))
              if cur is not None: groups.append(cur)
              dis = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'disallow' and v]
              allow = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'allow' and v]
              robots_cache[host] = (st, dis, allow)
              return robots_cache[host]

          def match(rule, path):
              pat = re.escape(rule).replace(r'\*', '.*')
              if pat.endswith(r'\$'): return re.match('^' + pat[:-2] + '$', path) is not None
              return re.match('^' + pat, path) is not None

          def allowed(url):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              # Match on path AND query. Dallas' rules are query-scoped
              # (`Disallow: /browse?*&q=`), so a path-only match would silently
              # ignore every one of them.
              path = (u.path or '/') + (f'?{u.query}' if u.query else '')
              d = [r for r in dis if match(r, path)]
              a = [r for r in allow if match(r, path)]
              # longest-match wins; Allow beats Disallow at equal length
              if d and (not a or max(len(x) for x in a) < max(len(x) for x in d)):
                  return False, d
              return True, []

          def jparse(b, label):
              # A 200 is not a promise of JSON: Houston's /api/catalog/v1 answers
              # HTML, which killed pass 2 outright. A probe records what it got
              # and carries on rather than dying on one response.
              try:
                  return json.loads(b), None
              except Exception as e:
                  return None, {'parse_error': str(e), 'body_prefix': b[:160].decode('utf-8', 'replace')}

          def fetch(url, label):
              ok, why = allowed(url)
              if not ok:
                  log.append({'url': url, 'label': label, 'status': 'SKIPPED_BY_ROBOTS', 'disallowed_by': why})
                  return None
              st, body = get(url)
              log.append({'url': url, 'label': label, 'status': st, 'bytes': len(body)})
              return body if st == 200 else None

          # ---- PASS 10 (last) ----
          # Houston, fairly. data.houstontx.gov disallows /api/ and /datastore/*
          # for User-agent: *, and that stands — nothing here re-attempts it.
          # But Fort Worth turned viable only once its OTHER publishing host was
          # asked, and Dallas was nearly killed on one dataset. Houston deserves
          # the same: ask its ArcGIS Hub site, which is a different host with its
          # own robots.txt that the guard evaluates independently. Checking a
          # second publisher is not routing around the first one's refusal.
          findings = collections.defaultdict(dict)

          for host in ['cohgis-mycity.opendata.arcgis.com', 'mycity.maps.arcgis.com',
                       'houston-hub-coh.hub.arcgis.com']:
              b = fetch(f'https://{host}/api/feed/dcat-us/1.1.json', f'houston-dcat:{host}')
              if not b:
                  findings['houston'][host] = 'no DCAT feed'
                  continue
              v, err = jparse(b, 'h-dcat')
              if err:
                  findings['houston'][host] = err
                  continue
              ds = v.get('dataset', [])
              findings['houston'][host] = {
                  'dataset_count': len(ds),
                  'permit_datasets': [
                      {'title': d.get('title'), 'license': d.get('license'),
                       'modified': d.get('modified'),
                       'publisher': (d.get('publisher') or {}).get('name'),
                       'formats': [x.get('format') for x in d.get('distribution', [])],
                       'rest': next((x.get('accessURL') for x in d.get('distribution', [])
                                     if '/rest/services/' in (x.get('accessURL') or '')), None)}
                      for d in ds
                      if 'permit' in (d.get('title', '') + ' ' + d.get('description', '')).lower()]}

          json.dump({'findings': findings, 'log': log}, open(f'{OUT}/probe-10.json', 'w'), indent=2)
          print(json.dumps(findings, indent=2)[:6000])
          print(f'\n{len(log)} requests; skipped by robots: '
                f'{sum(1 for x in log if x["status"] == "SKIPPED_BY_ROBOTS")}')
          PY
      - name: Commit findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/metro
          git commit -m "TEMPORARY: Round 39 metro probe findings" || echo "nothing to commit"
          git push
