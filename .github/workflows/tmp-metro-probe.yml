# TEMPORARY — Round 39 metro probe. DELETE BEFORE THE ROUND ENDS.
#
# ROBOTS COMPLIANCE IS ENFORCED IN CODE, NOT PROMISED. Round 37's probe said it
# had respected robots.txt and had not: it skimmed the first dozen Disallow
# lines and missed `Disallow: /api/` in San Antonio's `User-agent: *` group.
# So this fetches every robots.txt FIRST, parses the `*` group properly, and
# refuses any path that group disallows — recording the refusal as a finding
# rather than fetching anyway.
#
# Commits a small findings JSON and the robots files. No bulk rows.
name: TEMPORARY metro probe (Round 39)

on:
  push:
    branches: [claude/thi-v3-round39-metro-probe]
    paths: ['.github/workflows/tmp-metro-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate metros
        run: |
          mkdir -p tmp/metro/robots
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, collections

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/metro'
          log = []

          def get(url, timeout=90):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  code = getattr(e, 'code', 0)
                  return code, str(e).encode()

          # ---- robots: parse the User-agent: * group properly ----
          robots_cache = {}
          def star_rules(host):
              if host in robots_cache: return robots_cache[host]
              st, body = get(f'https://{host}/robots.txt', timeout=30)
              txt = body.decode('utf-8', 'replace') if st == 200 else ''
              open(f'{OUT}/robots/{host}.txt', 'w').write(txt if st == 200 else f'(HTTP {st})')
              groups, cur, agents = [], None, []
              for line in txt.splitlines():
                  l = line.split('#')[0].strip()
                  if not l: continue
                  k, _, v = l.partition(':')
                  k, v = k.strip().lower(), v.strip()
                  if k == 'user-agent':
                      if cur is not None and cur['rules']:
                          groups.append(cur); cur = None
                      if cur is None: cur = {'agents': [], 'rules': []}
                      cur['agents'].append(v)
                  elif cur is not None and k in ('allow', 'disallow'):
                      cur['rules'].append((k, v))
              if cur is not None: groups.append(cur)
              dis = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'disallow' and v]
              allow = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'allow' and v]
              robots_cache[host] = (st, dis, allow)
              return robots_cache[host]

          def match(rule, path):
              pat = re.escape(rule).replace(r'\*', '.*')
              if pat.endswith(r'\$'): return re.match('^' + pat[:-2] + '$', path) is not None
              return re.match('^' + pat, path) is not None

          def allowed(url):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              # Match on path AND query. Dallas' rules are query-scoped
              # (`Disallow: /browse?*&q=`), so a path-only match would silently
              # ignore every one of them.
              path = (u.path or '/') + (f'?{u.query}' if u.query else '')
              d = [r for r in dis if match(r, path)]
              a = [r for r in allow if match(r, path)]
              # longest-match wins; Allow beats Disallow at equal length
              if d and (not a or max(len(x) for x in a) < max(len(x) for x in d)):
                  return False, d
              return True, []

          def jparse(b, label):
              # A 200 is not a promise of JSON: Houston's /api/catalog/v1 answers
              # HTML, which killed pass 2 outright. A probe records what it got
              # and carries on rather than dying on one response.
              try:
                  return json.loads(b), None
              except Exception as e:
                  return None, {'parse_error': str(e), 'body_prefix': b[:160].decode('utf-8', 'replace')}

          def fetch(url, label):
              ok, why = allowed(url)
              if not ok:
                  log.append({'url': url, 'label': label, 'status': 'SKIPPED_BY_ROBOTS', 'disallowed_by': why})
                  return None
              st, body = get(url)
              log.append({'url': url, 'label': label, 'status': st, 'bytes': len(body)})
              return body if st == 200 else None

          # ---- PASS 4 (pass 3's queries; pass 3 lost them to a stale print) ----
          # Pass 2 findings this pass settles:
          #  * Dallas' rowsUpdatedAt is 2020-08-30 while its own metadata claims
          #    "Update Frequency: Daily". Do not kill a metro on a metadata field
          #    when that metro's OTHER metadata field was just caught lying —
          #    ask the data for its own max(issued_date).
          #  * Fort Worth's id from the cross-domain search 404s on its own host,
          #    so ask that host's catalogue instead.
          #  * Houston's /api/ is disallowed for User-agent: * and the guard
          #    refused it. That is the finding; no workaround is attempted.
          findings = {'dallas': {}, 'fortworth': {}, 'houston': 'ROBOTS: /api/ disallowed for *'}

          DH, DID = 'www.dallasopendata.com', 'e7gq-4sah'
          for label, q in [
              ('range', '$select=max(issued_date) as newest, min(issued_date) as oldest, count(1) as n'),
              ('by_month', '$select=date_trunc_ym(issued_date) as m, count(1) as n&$group=m&$order=m DESC&$limit=30'),
              ('by_type', '$select=permit_type, count(1) as n&$group=permit_type&$order=n DESC&$limit=15'),
          ]:
              b = fetch(f'https://{DH}/resource/{DID}.json?{q}', f'dallas:{label}')
              if b:
                  v, err = jparse(b, label)
                  findings['dallas'][label] = err or v

          FH = 'data.fortworthtexas.gov'
          b = fetch(f'https://{FH}/api/catalog/v1?q=permit&limit=40', 'fortworth:catalogue')
          if b:
              v, err = jparse(b, 'fw-cat')
              if err: findings['fortworth']['catalogue'] = err
              else:
                  findings['fortworth']['catalogue'] = [
                      {'name': r['resource']['name'], 'id': r['resource']['id'],
                       'type': r['resource'].get('type'), 'updated': r['resource'].get('updatedAt')}
                      for r in v.get('results', [])[:15]]
                  for r in v.get('results', [])[:6]:
                      if r['resource'].get('type') != 'dataset': continue
                      rid = r['resource']['id']
                      mb = fetch(f'https://{FH}/api/views/{rid}.json', f'fw-meta:{rid}')
                      if mb:
                          m, e2 = jparse(mb, 'fw-meta')
                          if not e2:
                              findings['fortworth'][rid] = {
                                  'name': m.get('name'), 'license': m.get('license'),
                                  'licenseId': m.get('licenseId'), 'attribution': m.get('attribution'),
                                  'rowsUpdatedAt': m.get('rowsUpdatedAt'),
                                  'custom': (m.get('metadata') or {}).get('custom_fields'),
                                  'columns': [c.get('fieldName') for c in m.get('columns', [])]}

          # ---- corridor: one looser look, then done ----
          # Pass 1 searched ArcGIS Hub for "building permits" per city and pass 2
          # found no open-data host for any of the four. This is the last look:
          # a looser Hub query and the city's own Socrata footprint. If nothing
          # machine-readable turns up here, that is the finding — no workaround.
          findings['corridor'] = {}
          for city in ['New Braunfels', 'San Marcos TX', 'Round Rock', 'Kyle TX']:
              row = {}
              q = urllib.parse.quote(f'{city} permit')
              b = fetch(f'https://hub.arcgis.com/api/v3/datasets?q={q}&page[size]=10',
                        f'corridor-hub:{city}')
              if b:
                  v, err = jparse(b, 'hub')
                  row['hub'] = err or [
                      {'title': (d.get('attributes') or {}).get('name'),
                       'owner': (d.get('attributes') or {}).get('source'),
                       'type': (d.get('attributes') or {}).get('type')}
                      for d in (v.get('data') or [])]
              b = fetch(f'https://api.us.socrata.com/api/catalog/v1?q={q}&limit=10',
                        f'corridor-socrata:{city}')
              if b:
                  v, err = jparse(b, 'socrata')
                  row['socrata'] = err or [
                      {'name': r['resource']['name'],
                       'domain': r.get('metadata', {}).get('domain')}
                      for r in (v.get('results') or [])]
              findings['corridor'][city] = row

          # ---- Houston: record the refusal, do not work around it ----
          hst, hdis, hallow = star_rules('data.houstontx.gov')
          findings['houston'] = {
              'robots_status': hst,
              'star_group_disallow_count': len(hdis),
              'machine_readable_paths_disallowed': [r for r in hdis
                                                    if r.startswith(('/api', '/datastore'))],
              'note': 'CKAN portal. Both /api/ and /datastore/* are disallowed for '
                      'User-agent: *, so no compliant machine-readable read exists. '
                      'No workaround attempted.'}

          json.dump({'findings': findings, 'log': log}, open(f'{OUT}/probe-4.json', 'w'), indent=2)
          print(json.dumps(findings, indent=2)[:6000])
          print(f'\n{len(log)} requests; skipped by robots: '
                f'{sum(1 for x in log if x["status"] == "SKIPPED_BY_ROBOTS")}')
          PY
      - name: Commit findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/metro
          git commit -m "TEMPORARY: Round 39 metro probe findings" || echo "nothing to commit"
          git push
