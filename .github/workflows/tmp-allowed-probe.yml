# TEMPORARY — Round 41d probe. DELETE BEFORE THE ROUND ENDS.
#
# Item 20: two shipped fetchers request paths their host disallows for
# `User-agent: *`. This looks for the SAME DATA on a path the host permits.
#
# It does not assume one exists. Each candidate is (a) robots-checked against
# the literal file, (b) fetched, and (c) compared against the values already
# committed in src/data/generated — which is the only available baseline, since
# the current path cannot be fetched to compare against.
#
# Robots guard carried from Round 39/41c, including BOTH 41c corrections:
# a blank line closes a group even when it has no rules, and rules are matched
# against path AND query.
name: TEMPORARY allowed-path probe (Round 41d)

on:
  push:
    branches: [claude/thi-v3-round41d-allowed-paths]
    paths: ['.github/workflows/tmp-allowed-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe allowed paths
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          mkdir -p tmp/allowed/robots
          python3 - <<'PY'
          import json, os, re, math, csv, io, urllib.parse, urllib.request, collections

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/allowed'
          log = []
          def get(url, timeout=90):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  code = getattr(e, 'code', 0)
                  return code, str(e).encode()

          # ---- robots: parse the User-agent: * group properly ----
          robots_cache = {}
          def star_rules(host):
              if host in robots_cache: return robots_cache[host]
              st, body = get(f'https://{host}/robots.txt', timeout=30)
              txt = body.decode('utf-8', 'replace') if st == 200 else ''
              open(f'{OUT}/robots/{host}.txt', 'w').write(txt if st == 200 else f'(HTTP {st})')
              groups, cur, agents = [], None, []
              for line in txt.splitlines():
                  l = line.split('#')[0].strip()
                  # ⚠️ A BLANK LINE ENDS A GROUP (RFC 9309 §2.2.1). Pass 1 skipped
                  # blank lines, so on www2.census.gov — which opens with a bare
                  # `User-agent: *` and no rules, then a blank line, then
                  # `User-agent: RavenCrawler` / `Disallow: /` — it merged the two
                  # and refused the whole host to everyone. A guard that errs
                  # toward refusing still produces a false finding.
                  if not l:
                      # UNCONDITIONALLY, even with no rules. Pass 2 kept the
                      # `and cur['rules']` guard here and so changed nothing:
                      # `User-agent: *` with an empty rule set is still a
                      # complete group, and leaving it open let the next
                      # `User-agent:` line join it. That guard belongs only on
                      # the user-agent branch, where CONSECUTIVE agent lines do
                      # legitimately share one group.
                      if cur is not None:
                          groups.append(cur)
                          cur = None
                      continue
                  k, _, v = l.partition(':')
                  k, v = k.strip().lower(), v.strip()
                  if k == 'user-agent':
                      if cur is not None and cur['rules']:
                          groups.append(cur); cur = None
                      if cur is None: cur = {'agents': [], 'rules': []}
                      cur['agents'].append(v)
                  elif cur is not None and k in ('allow', 'disallow'):
                      cur['rules'].append((k, v))
              if cur is not None: groups.append(cur)
              dis = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'disallow' and v]
              allow = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'allow' and v]
              robots_cache[host] = (st, dis, allow)
              return robots_cache[host]

          def match(rule, path):
              pat = re.escape(rule).replace(r'\*', '.*')
              if pat.endswith(r'\$'): return re.match('^' + pat[:-2] + '$', path) is not None
              return re.match('^' + pat, path) is not None

          def allowed(url):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              # Path AND query. Round 39 pass 4: Dallas' rules were query-scoped
              # (`Disallow: /browse?*&q=`) and a path-only match ignored them all.
              path = (u.path or '/') + (f'?{u.query}' if u.query else '')
              d = [r for r in dis if match(r, path)]
              a = [r for r in allow if match(r, path)]
              # longest-match wins; Allow beats Disallow at equal length
              if d and (not a or max(len(x) for x in a) < max(len(x) for x in d)):
                  return False, d
              return True, []

          def fetch(url, label):
              ok, why = allowed(url)
              if not ok:
                  log.append({'url': url, 'label': label, 'status': 'SKIPPED_BY_ROBOTS', 'disallowed_by': why})
                  return None
              st, body = get(url)
              log.append({'url': url, 'label': label, 'status': st, 'bytes': len(body)})
              return body if st == 200 else None

          F = collections.defaultdict(dict)

          def probe(url, label, note):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              ok, why = allowed(url)
              rec = {'url': url, 'note': note, 'host': u.netloc,
                     'robots_status': st, 'star_disallow_count': len(dis),
                     'robots_allows': ok, 'matched_disallow': why}
              if ok:
                  b = fetch(url, label)
                  rec['http'] = next((e['status'] for e in reversed(log) if e['url'] == url), None)
                  rec['bytes'] = len(b) if b else 0
                  rec['body_head'] = b[:600].decode('utf-8', 'replace') if b else None
                  return rec, b
              return rec, None

          # ── PASS 2 ──────────────────────────────────────────────────────
          # Pass 1 found a permitted path for both feeds. Two things decide
          # whether either can actually be used.

          # A · SWDI: does the NCEI host return THE SAME ROWS as the committed
          #     data? Comparing against src/data/generated/swdi-nx3hail, whose
          #     San Antonio window is 2026-08-27 .. 2026-09-12.
          BBOX = '-98.9936,28.9241,-97.9936,29.9241'
          u = f'https://www.ncei.noaa.gov/swdiws/csv/nx3hail/20260827:20260913?bbox={BBOX}'
          rec, b = probe(u, 'swdi:equivalence-window', 'same window as the committed San Antonio rows')
          if b:
              txt = b.decode('utf-8', 'replace')
              rows = [l for l in txt.splitlines() if l and not l.startswith('#')]
              rec['header'] = rows[0] if rows else None
              rec['data_rows'] = max(0, len(rows) - 1)
              rec['first_five'] = rows[1:6]
              rec['last_two'] = rows[-2:]
          F['swdi_equivalence'] = rec

          # Is the ncdc host simply redirecting to ncei? If it is, the two are
          # the same service and equivalence is structural, not coincidental.
          for host_url, note in [
              ('https://www.ncei.noaa.gov/swdiws/', 'ncei swdiws root'),
              ('https://www.ncdc.noaa.gov/', 'does ncdc redirect to ncei at all'),
          ]:
              r2, b2 = probe(host_url, f'redirect:{host_url}', note)
              F['host_relationship'][host_url] = r2

          # B · NORMALS: the Access Data Service returned the VALUES but not the
          #     three qualifying columns Round 19c made essential — years,
          #     comp_flag, meas_flag. Without them the Kelly AFB rejection
          #     (years=2, comp_flag=E) cannot be made, and a two-year estimated
          #     record would be published as a 30-year normal. Can they be had?
          ADS = 'https://www.ncei.noaa.gov/access/services/data/v1'
          ST = 'USW00013958'
          NORMALS_ATTRS = [
              (f'{ADS}?dataset=normals-monthly-1991-2020&stations={ST}'
               f'&dataTypes=MLY-CLDD-NORMAL&format=json&includeAttributes=true',
               'includeAttributes=true'),
              (f'{ADS}?dataset=normals-monthly-1991-2020&stations={ST}'
               f'&dataTypes=MLY-CLDD-NORMAL,years_MLY-CLDD-NORMAL,comp_flag_MLY-CLDD-NORMAL'
               f'&format=json', 'ask for the companion columns by name'),
              (f'{ADS}?dataset=normals-monthly-1991-2020&stations={ST}&format=json',
               'no dataTypes at all — does it return every column'),
              (f'{ADS}?dataset=normals-monthly-1991-2020&stations={ST}'
               f'&dataTypes=MLY-CLDD-NORMAL&format=csv&includeAttributes=true',
               'csv with attributes'),
          ]
          for url, note in NORMALS_ATTRS:
              r3, _ = probe(url, f'normals-attrs:{note}', note)
              F['normals_attributes'][note] = r3

          # And the same for the station this actually selected for San Antonio,
          # whose committed normals carry years=19/20 and comp_flag=R — a
          # station the quality filter ACCEPTED, so its flags must survive too.
          r4, _ = probe(f'{ADS}?dataset=normals-monthly-1991-2020&stations=USW00012970'
                        f'&dataTypes=MLY-CLDD-NORMAL&format=json&includeAttributes=true',
                        'normals:sa-station', 'San Antonio Stinson, committed years=19/20 flag=R')
          F['normals_attributes']['sa_station'] = r4

          json.dump({'findings': F, 'log': log}, open(f'{OUT}/probe-2.json', 'w'), indent=2)
          for group in ('swdi', 'normals'):
              print(f'\n══ {group.upper()} ══')
              for url, r in F[group].items():
                  verdict = 'ROBOTS-REFUSED' if not r['robots_allows'] else f"HTTP {r.get('http')} ({r.get('bytes')}b)"
                  print(f"  {verdict:24s} {url[:95]}")
          print(f'\n{len(log)} requests; skipped by robots: '
                f'{sum(1 for x in log if x["status"] == "SKIPPED_BY_ROBOTS")}')
          PY
      - name: Commit findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/allowed
          git commit -m "TEMPORARY: Round 41d probe findings" || echo "nothing to commit"
          git push
