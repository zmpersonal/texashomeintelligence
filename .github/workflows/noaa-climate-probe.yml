              flat = re.sub(r"\s+", " ", text)
              hits = list(HARD.finditer(flat))
              print(f"    [{host}] {label}: {len(HARD_ANY.findall(flat))} mention(s) of "
                    f"'hardness', {len(hits)} with a number and a unit")
              for m in hits[:10]:
                  print(f"      value={m.group(2)} units={m.group(3)}  ...{m.group(0)[:150].strip()}...")
              if HARD_ANY.search(flat) and not hits:
                  for m in list(HARD_ANY.finditer(flat))[:4]:
                      s = max(0, m.start() - 120)
                      print(f"      (no number matched) ...{flat[s:m.end() + 160].strip()}...")
              return len(hits)

          today = datetime.date.today()
          print(f"probe date (runner UTC): {today.isoformat()}")

          # ══ PART 1 — WATER HARDNESS ═══════════════════════════════════════
          # ── 1. Utility publications. Landing pages are LISTED, links are
          # DISCOVERED from them, and only allowlisted hosts are followed. No
          # PDF filename is guessed: Round 19b guessed one and got a 404.
          hr("1. UTILITY PUBLICATIONS — SAWS and Austin Water")
          LANDINGS = [
