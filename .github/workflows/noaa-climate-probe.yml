# ══════════════════════════════════════════════════════════════════════════
# ROUND 19 — TEMPORARY. DELETE THIS ENTIRE FILE once the cooling-degree-day
# question is settled. It is a diagnostic, not infrastructure.
# ══════════════════════════════════════════════════════════════════════════
#
# WHY IT EXISTS
# Round 19 must implement `noaa-climate` as a real fetcher. It cannot be
# characterised from the Claude Code container: `www.ncei.noaa.gov` and
# `www.ncdc.noaa.gov` both answer `connect_rejected` — a policy 403 on
# CONNECT — exactly as `traviscad.org` did in Round 16 and as every other
# data host this project ingests from does. The Actions runner reaches those
# hosts; the container does not. That asymmetry is the whole reason for this
# file.
#
# WHAT IT IS ALLOWED TO DO
# Read. That is all. It writes only under `$RUNNER_TEMP`, never under
# `site/`, and it has no commit step, no write permission and no token use.
# `permissions: contents: read` is set explicitly rather than inherited, so
# the job could not push even if a future edit tried to.
#
# WHY A SEPARATE FILE RATHER THAN A STEP IN data-ingestion.yml
# Same reason as Round 16b's `tcad-probe.yml`: a standalone dispatch-only
# file is deleted in one `git rm` with nothing left behind, and it cannot
# fail an ingestion run it is riding along with — because it does not ride
# along with one.
#
# NOTHING HERE IS INFERRED FROM A BRIEF. The fetcher this round ships picks
# its station by bounding box around the representative point already in
# `site/src/data/zip-areas.ts`, precisely so no station id has to be
# asserted. This probe exists to confirm that choice against live responses:
# which endpoint answers without a token, what the degree-day datatype is
# actually called, which stations fall in each metro's box, how far behind
# real time the newest row is, and whether a NATIONAL cooling-degree-day
# baseline is published anywhere reachable without a key. Every section
# prints what it received, including failures, rather than concluding.
name: "TEMP (Round 19): NOAA cooling-degree-day probe"

on:
  workflow_dispatch:

# Explicit, not inherited. This job reads public files and prints to a log.
permissions:
  contents: read

concurrency:
  group: noaa-climate-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout of the repo is needed and none is done: the probe touches
      # nothing in this repository. That is the strongest guarantee available
      # that it cannot modify site/.
      - name: Probe NOAA NCEI for cooling degree days
        # A diagnostic must report what it found even when part of it fails.
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, re, sys, datetime
          import urllib.request, urllib.error, urllib.parse

          UA = ("TexasHomeIntelligence-probe/1.0 (one-off read-only characterisation; "
                "contact via github.com/zmpersonal/texashomeintelligence)")

          # A probe that streams a climate archive is a bug, not a probe.
          CEIL = 8 * 1024 * 1024
          TIMEOUT = 60

          # ── The ONLY inputs. Both are read out of site/src/data/zip-areas.ts
          # (AREAS[].point) rather than invented here, and they are the same two
          # points the fetcher shipped this round uses. Nothing else about a
          # station is assumed.
          POINTS = {
              "austin":      (30.2672, -97.7431),
              "san-antonio": (29.4241, -98.4936),
          }
          # ~0.35 deg is roughly 24 mi N-S. Deliberately printed, because the
          # fetcher's box size is a judgement call the log should expose.
          PAD = 0.35

          today = datetime.date.today()
          counts = {"requests": 0, "ok": 0, "failed": 0}

          def hr(title):
              print("\n" + "=" * 74)
              print(title)
              print("=" * 74)

          def get(url, label=""):
              """Returns (status, body_bytes_or_None, note). Never raises."""
              counts["requests"] += 1
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(CEIL + 1)
                      truncated = len(body) > CEIL
                      if truncated:
                          body = body[:CEIL]
                      counts["ok"] += 1
                      note = f"HTTP {r.status}, {len(body)} bytes" + (" (TRUNCATED at ceiling)" if truncated else "")
                      print(f"  [{label or 'GET'}] {note}\n    {url}")
                      return r.status, body, note
              except urllib.error.HTTPError as e:
                  counts["failed"] += 1
                  detail = b""
                  try:
                      detail = e.read(2000)
                  except Exception:
                      pass
                  print(f"  [{label or 'GET'}] HTTP {e.code} {e.reason}\n    {url}")
                  if detail:
                      print(f"    body: {detail[:600]!r}")
                  return e.code, None, f"HTTP {e.code}"
              except Exception as e:
                  counts["failed"] += 1
                  print(f"  [{label or 'GET'}] FAILED {type(e).__name__}: {e}\n    {url}")
                  return None, None, f"{type(e).__name__}"

          def as_json(body):
              if body is None:
                  return None
              try:
                  return json.loads(body.decode("utf-8", "replace"))
              except Exception as e:
                  print(f"    (not JSON: {type(e).__name__}) first 300 bytes: {body[:300]!r}")
                  return None

          def box(lat, lon):
              """NCEI documents bbox as north,west,south,east. That ordering is
              the single most likely thing in this probe to be wrong, so both
              orderings are tried in section 2 and the log says which answered."""
              n, s = round(lat + PAD, 4), round(lat - PAD, 4)
              w, e = round(lon - PAD, 4), round(lon + PAD, 4)
              return f"{n},{w},{s},{e}", f"{s},{w},{n},{e}"

          print(f"probe date (runner UTC): {today.isoformat()}")
          print(f"bounding-box pad: +/-{PAD} deg around each metro's representative point")
          for k, (la, lo) in POINTS.items():
              nwse, swne = box(la, lo)
              print(f"  {k:12s} point=({la}, {lo})  bbox(N,W,S,E)={nwse}  bbox(S,W,N,E)={swne}")

          # ── 1. DOES THE TOKEN-FREE ACCESS SERVICE ANSWER AT ALL? ──────────
          # The stub this round replaces pointed at CDO v2, which needs a free
          # token nobody has requested. If the Access Data Service answers
          # without one, the fetcher needs no secret and no owner seam. That is
          # the single most consequential thing this probe can establish.
          hr("1. ENDPOINT REACHABILITY (no token sent on any request)")
          for label, url in [
              ("access-data-v1 (bare)",
               "https://www.ncei.noaa.gov/access/services/data/v1"),
              ("search-v1 datasets",
               "https://www.ncei.noaa.gov/access/services/search/v1/datasets?limit=5"),
              ("normals-monthly index",
               "https://www.ncei.noaa.gov/data/normals-monthly/1991-2020/access/"),
              ("cdo-web v2 (token-gated; expect 400/401)",
               "https://www.ncei.noaa.gov/cdo-web/api/v2/datasets?limit=1"),
          ]:
              get(url, label)

          # ── 2. WHICH BBOX ORDERING, AND WHICH STATIONS? ───────────────────
          # Discovery, not assertion: the fetcher picks a station from whatever
          # this returns. If it returns nothing for a metro, that metro has no
          # usable station and the round's rule is to leave it unavailable.
          hr("2. STATION DISCOVERY BY BOUNDING BOX (global-summary-of-the-month)")
          start = (today.replace(day=1) - datetime.timedelta(days=400)).isoformat()
          end = today.isoformat()
          for metro, (la, lo) in POINTS.items():
              nwse, swne = box(la, lo)
              for order_label, bb in (("N,W,S,E", nwse), ("S,W,N,E", swne)):
                  q = urllib.parse.urlencode({
                      "dataset": "global-summary-of-the-month",
                      "bbox": bb,
                      "startDate": start,
                      "endDate": end,
                      "format": "json",
                      "includeStationName": "true",
                      "includeStationLocation": "1",
                      "units": "standard",
                      "limit": "1000",
                  })
                  url = f"https://www.ncei.noaa.gov/access/services/data/v1?{q}"
                  st, body, _ = get(url, f"{metro} bbox {order_label}")
                  rows = as_json(body)
                  if not isinstance(rows, list) or not rows:
                      print("    -> no rows returned for this ordering")
                      continue
                  print(f"    -> {len(rows)} row(s)")
                  # What are the columns actually called? This is how the
                  # datatype id is LEARNED rather than guessed.
                  keys = sorted({k for r in rows[:200] for k in r.keys()})
                  print(f"    columns present: {keys}")
                  degree_keys = [k for k in keys if re.search(r"(CLDD|HTDD|CDSD|HDSD|DD)", k, re.I)]
                  print(f"    degree-day-looking columns: {degree_keys or 'NONE'}")
                  by_station = {}
                  for r in rows:
                      sid = r.get("STATION") or r.get("station") or "?"
                      by_station.setdefault(sid, []).append(r)
                  print(f"    {len(by_station)} station(s) in box:")
                  for sid, rs in sorted(by_station.items(), key=lambda kv: -len(kv[1]))[:12]:
                      dates = sorted(str(r.get("DATE") or r.get("date") or "") for r in rs)
                      name = rs[0].get("NAME") or rs[0].get("name") or ""
                      filled = 0
                      sample = ""
                      for k in degree_keys:
                          vals = [(r.get("DATE"), r.get(k)) for r in rs if str(r.get(k) or "").strip() not in ("", "-9999")]
                          if vals:
                              filled = max(filled, len(vals))
                              if not sample:
                                  sample = f"{k}: " + ", ".join(f"{d}={v}" for d, v in vals[-4:])
                      print(f"      {sid:16s} n={len(rs):3d} {dates[0]}..{dates[-1]}  filled={filled}  {name}")
                      if sample:
                          print(f"        {sample}")
                  break  # this ordering worked; don't repeat the query

          # ── 3. PUBLICATION LAG ────────────────────────────────────────────
          # Measured, not assumed: newest DATE returned above vs the runner's
          # own date. This is what the freshness window in
          # site/src/lib/dataFreshness.ts has to absorb.
          hr("3. PUBLICATION LAG (newest monthly row vs runner date)")
          for metro, (la, lo) in POINTS.items():
              nwse, _ = box(la, lo)
              q = urllib.parse.urlencode({
                  "dataset": "global-summary-of-the-month",
                  "bbox": nwse,
                  "startDate": (today - datetime.timedelta(days=200)).isoformat(),
                  "endDate": end,
                  "dataTypes": "CLDD",
                  "format": "json",
                  "units": "standard",
              })
              st, body, _ = get(f"https://www.ncei.noaa.gov/access/services/data/v1?{q}", f"{metro} CLDD-only")
              rows = as_json(body)
              if isinstance(rows, list) and rows:
                  dated = sorted(r for r in {str(x.get("DATE")) for x in rows} if r and r != "None")
                  print(f"    months returned: {dated}")
                  if dated:
                      y, m = (dated[-1].split("-") + ["01"])[:2]
                      newest = datetime.date(int(y), int(m), 1)
                      print(f"    newest month start = {newest}; runner date = {today}; "
                            f"lag from month start = {(today - newest).days} days")
              else:
                  print("    -> dataTypes=CLDD returned nothing. If section 2 showed a "
                        "degree-day column under a DIFFERENT name, THAT is the id to use.")

          # ── 4. IS A NATIONAL BASELINE PUBLISHED, OR WOULD WE DERIVE IT? ───
          # A "runs N times harder than the national average" claim needs a
          # national CDD figure on the SAME basis (base 65F, same period,
          # population-weighted or not). This section only establishes whether
          # one is reachable without a key. It does not compute a multiplier.
          hr("4. NATIONAL COOLING-DEGREE-DAY BASELINE — published or derived?")
          for label, url in [
              ("CPC population-weighted degree days (index)",
               "https://ftp.cpc.ncep.noaa.gov/htdocs/degree_days/weighted/monthly_data/"),
              ("CPC monthly CDD by state/nation (current year)",
               f"https://ftp.cpc.ncep.noaa.gov/htdocs/degree_days/weighted/monthly_data/{today.year}/Population.Weighted.Monthly.CDD.txt"),
              ("Climate at a Glance national CDD (JSON)",
               "https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/national/time-series/110/cdd/1/8/2015-2026.json"),
          ]:
              st, body, _ = get(url, label)
              if body:
                  head = body[:700].decode("utf-8", "replace")
                  print("    first 700 bytes:")
                  for line in head.splitlines()[:14]:
                      print(f"      {line}")

          # ── 5. 30-YEAR NORMALS (the other candidate basis) ────────────────
          # If monthly actuals prove unusable, monthly normals are the fallback
          # basis for a "typical season" figure. Whether the station file names
          # match the ids found in section 2 is the thing to look at here.
          hr("5. 1991-2020 MONTHLY NORMALS — station file naming")
          st, body, _ = get(
              "https://www.ncei.noaa.gov/data/normals-monthly/1991-2020/doc/Normals_Monthly_Documentation_1991-2020.pdf",
              "normals documentation (existence only)")
          st, body, _ = get(
              "https://www.ncei.noaa.gov/data/normals-monthly/1991-2020/access/",
              "normals station-file index")
          if body:
              text = body.decode("utf-8", "replace")
              tx = re.findall(r'href="(USW000\d+\.csv)"', text)
              print(f"    {len(tx)} station csv links visible in the index page "
                    f"(first 6: {tx[:6]})")
              if not tx:
                  print("    no station csv links matched; first 400 bytes:")
                  print(f"      {text[:400]!r}")

          # Round 15b's discipline: a run that reached an answer says so. Its
          # absence means the probe crashed, which is a different finding from
          # "the data is not there".
          print(f"\nNOAA_PROBE_STATUS=complete requests={counts['requests']} "
                f"ok={counts['ok']} failed={counts['failed']}")
          PY

      # ══ ROUND 19b — the Round 19 probe falsified the Round 19 fetcher. ══
      #
      # The 2026-09-05 dispatch of the step above measured that the Access Data
      # Service rejects bounding-box station discovery outright:
      #
      #     HTTP 400  errors: [{"field":"stations","message":"A station is required."}]
      #
      # — both bbox orderings, both metros. It also measured that
      # `data/normals-monthly/1991-2020/access/` answers 200 with an index of
      # 1,162 static station CSVs, which is the replacement path.
      #
      # TWO THINGS ARE STILL UNMEASURED and neither may be guessed, which is
      # why this is a second probe and not a second fetcher:
      #
      #   1. WHICH of those 1,162 files covers Austin, and which covers San
      #      Antonio. The last run showed the index exists. It did not show the
      #      mapping.
      #   2. What is INSIDE one of those CSVs — whether it carries a cooling
      #      degree-day normal at all, under what column name, on what base,
      #      and in what month layout.
      #
      # Round 19 shipped a fetcher on an assumption about a query parameter.
      # Shipping again on an assumption about a file layout would be the same
      # mistake wearing a different hat.
      #
      # NOTE ON BOUNDING BOXES. They appear again below, and they are doing
      # something completely different this time: the station list is
      # DOWNLOADED and filtered LOCALLY, in this script. Nothing asks a server
      # to interpret a bbox. That is the parameter the last run proved
      # unsupported.
      - name: "TEMP (Round 19b): normals station mapping + CSV layout"
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import csv, io, json, os, re, sys, datetime
          import urllib.request, urllib.error, urllib.parse

          UA = ("TexasHomeIntelligence-probe/1.0 (one-off read-only characterisation; "
                "contact via github.com/zmpersonal/texashomeintelligence)")
          TIMEOUT = 90
          SMALL = 8 * 1024 * 1024          # index pages, JSON, one station CSV
          BIG = 32 * 1024 * 1024           # the GHCN station inventory is ~10 MB
          MAX_STATION_CSVS = 4             # a probe that pulls 1,162 files is a bug

          POINTS = {"austin": (30.2672, -97.7431), "san-antonio": (29.4241, -98.4936)}
          PAD = 0.35

          counts = {"requests": 0, "ok": 0, "failed": 0, "csvs": 0}

          # Declared up front, not inside section 1. The offline dry run of this
          # probe found that a 404 on the directory listing followed by a 200 on
          # the index — an ordinary mixed outcome — left `inventoryish` unbound
          # and crashed section 3 with a NameError, taking sections 4 and 5 and
          # the status line down with it. A probe that dies silently is the one
          # thing this file must not do.
          root_links: list = []
          inventoryish: list = []

          # The crash guard, in its strongest form: whatever happens, the log
          # ends with a status line, and "crashed" is distinguishable from
          # "measured nothing".
          def _crash(exc_type, exc, tb):
              import traceback
              traceback.print_exception(exc_type, exc, tb)
              print(f"\nNOAA_PROBE2_STATUS=error requests={counts['requests']} "
                    f"ok={counts['ok']} failed={counts['failed']} "
                    f"station_csvs={counts['csvs']} crash={exc_type.__name__}: {exc}")
          sys.excepthook = _crash

          def hr(title):
              print("\n" + "=" * 74)
              print(title)
              print("=" * 74)

          def get(url, label="", ceil=SMALL):
              counts["requests"] += 1
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(ceil + 1)
                      trunc = len(body) > ceil
                      if trunc:
                          body = body[:ceil]
                      counts["ok"] += 1
                      print(f"  [{label or 'GET'}] HTTP {r.status}, {len(body)} bytes"
                            + (" (TRUNCATED at ceiling)" if trunc else ""))
                      print(f"    {url}")
                      return r.status, body
              except urllib.error.HTTPError as e:
                  counts["failed"] += 1
                  detail = b""
                  try:
                      detail = e.read(1500)
                  except Exception:
                      pass
                  print(f"  [{label or 'GET'}] HTTP {e.code} {e.reason}\n    {url}")
                  if detail:
                      print(f"    body: {detail[:800]!r}")
                  return e.code, None
              except Exception as e:
                  counts["failed"] += 1
                  print(f"  [{label or 'GET'}] FAILED {type(e).__name__}: {e}\n    {url}")
                  return None, None

          def in_box(lat, lon):
              """Local filter. Nothing server-side interprets this."""
              for metro, (mlat, mlon) in POINTS.items():
                  if abs(lat - mlat) <= PAD and abs(lon - mlon) <= PAD:
                      return metro
              return None

          NORMALS_ROOT = "https://www.ncei.noaa.gov/data/normals-monthly/1991-2020/"
          ACCESS = NORMALS_ROOT + "access/"

          print(f"probe date (runner UTC): {datetime.date.today().isoformat()}")
          print(f"local filter box: +/-{PAD} deg around austin{POINTS['austin']} "
                f"and san-antonio{POINTS['san-antonio']}")

          # ── 1. WHAT ELSE THE NORMALS PRODUCT PUBLISHES ────────────────────
          # The documentation PDF the last run guessed at returned 404. Rather
          # than guess a second filename, list the directory and print every
          # link, so the real names are read rather than invented.
          hr("1. NORMALS PRODUCT DIRECTORY — what actually exists next to access/")
          _, body = get(NORMALS_ROOT, "normals root listing")
          if body:
              text = body.decode("utf-8", "replace")
              root_links = re.findall(r'href="([^"?][^"]*)"', text)
              print(f"    {len(root_links)} link(s):")
              for href in root_links[:40]:
                  print(f"      {href}")
              inventoryish = [h for h in root_links
                              if re.search(r"(invent|station|list|readme|doc|meta)", h, re.I)]
              print(f"    inventory/doc-looking: {inventoryish or 'NONE'}")
          else:
              print("    no listing returned — sections 3 and 4 fall back to other sources")

          # ── 2. THE ACCESS INDEX, IN FULL ──────────────────────────────────
          # The previous run matched only `USW000\d+\.csv`. That prefix is
          # airport/first-order stations; USC (co-op) and USR files would have
          # been silently invisible. This counts every csv and breaks the total
          # down by prefix, because "1,162" meaning something different from
          # what was assumed is exactly the kind of thing to find out now.
          hr("2. access/ INDEX — every station CSV, by prefix")
          _, body = get(ACCESS, "normals access index")
          all_csvs = []
          if body:
              text = body.decode("utf-8", "replace")
              all_csvs = sorted(set(re.findall(r'href="([A-Za-z0-9_\-]+\.csv)"', text)))
              from collections import Counter
              pref = Counter(c[:3] for c in all_csvs)
              print(f"    {len(all_csvs)} csv file(s) total")
              print(f"    by 3-char prefix: {dict(sorted(pref.items(), key=lambda kv: -kv[1]))}")
              print(f"    first 8: {all_csvs[:8]}")
              usw = [c for c in all_csvs if c.startswith("USW")]
              print(f"    USW (first-order/airport) count: {len(usw)}")
          else:
              print("    index unavailable this run")

          # ── 3. THE MAPPING — station coordinates, from a downloaded list ───
          # Three candidate sources, tried in order, each printed whether it
          # answers or not. Whichever answers gives id -> lat/lon/name, which is
          # filtered locally to the two metro boxes. THIS is the mapping Round
          # 19b needs and could not assume.
          hr("3. METRO -> STATION FILE MAPPING (from a downloaded station list)")
          index_ids = {c.rsplit(".", 1)[0] for c in all_csvs}
          matches = {"austin": [], "san-antonio": []}
          mapping_source = None

          # 3a. Anything inventory-shaped found in section 1.
          for href in inventoryish:
              url = urllib.parse.urljoin(NORMALS_ROOT, href)
              if url.endswith("/"):
                  continue
              st, b = get(url, f"candidate inventory {href}", ceil=BIG)
              if not b:
                  continue
              head = b[:1200].decode("utf-8", "replace")
              print("    first 1200 bytes:")
              for line in head.splitlines()[:12]:
                  print(f"      {line}")

          # 3b. The GHCN-Daily station inventory: id, lat, lon, name in fixed
          # columns. Unverified path — printed either way.
          st, b = get("https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt",
                      "ghcnd-stations.txt", ceil=BIG)
          if b:
              lines = b.decode("utf-8", "replace").splitlines()
              print(f"    {len(lines)} station record(s); first record verbatim:")
              if lines:
                  print(f"      {lines[0]!r}")
              hits = 0
              for line in lines:
                  # Documented fixed-width layout: id 1-11, lat 13-20, lon 22-30,
                  # name 42-71. If the slice yields nonsense the print shows it.
                  try:
                      sid = line[0:11].strip()
                      lat = float(line[12:20]); lon = float(line[21:30])
                      name = line[41:71].strip()
                  except Exception:
                      continue
                  metro = in_box(lat, lon)
                  if metro:
                      matches[metro].append((sid, name, lat, lon, sid in index_ids))
                      hits += 1
              if hits:
                  mapping_source = "ghcnd-stations.txt"
              print(f"    {hits} station(s) fell inside the two metro boxes")

          # 3c. search/v1 — characterise its shape while we are here. This is
          # what approach (a) would have depended on, and its response shape has
          # never been seen. Printed whether or not (b) succeeds, so a future
          # round choosing (a) is not starting blind.
          for label, url in [
              ("search/v1 datasets (ids we may ask for)",
               "https://www.ncei.noaa.gov/access/services/search/v1/datasets?limit=40"),
              ("search/v1 data — normals, Austin box",
               "https://www.ncei.noaa.gov/access/services/search/v1/data?"
               + urllib.parse.urlencode({
                   "dataset": "normals-monthly-1991-2020",
                   "boundingBox": "30.6172,-98.0931,29.9172,-97.3931",
                   "limit": "5"})),
          ]:
              st, b = get(url, label)
              if b:
                  try:
                      j = json.loads(b.decode("utf-8", "replace"))
                      print(f"    top-level keys: {list(j)[:12] if isinstance(j, dict) else type(j).__name__}")
                      print(f"    first 900 chars: {json.dumps(j)[:900]}")
                  except Exception:
                      print(f"    not JSON; first 400 bytes: {b[:400]!r}")

          print(f"\n  MAPPING SOURCE THAT ANSWERED: {mapping_source or 'NONE'}")
          for metro, rows in matches.items():
              print(f"  {metro}: {len(rows)} candidate(s)")
              for sid, name, lat, lon, in_index in sorted(rows, key=lambda r: (not r[4], r[0]))[:10]:
                  flag = "IN access/ index" if in_index else "not in index"
                  print(f"    {sid:14s} ({lat:8.4f},{lon:9.4f})  {flag:17s}  {name}")

          # ── 4. THE CSV LAYOUT ─────────────────────────────────────────────
          # Whether a normals station file carries a cooling-degree-day normal
          # at all, under what name, on what base. If section 3 found nothing,
          # the first file in the index is fetched anyway: the LAYOUT is the
          # same whichever station it is, so "we cannot find the right station"
          # stays a separate finding from "we do not know the format".
          hr("4. NORMALS CSV LAYOUT — is there a CDD normal, and what is it called?")
          picks = []
          for metro in ("austin", "san-antonio"):
              for sid, name, lat, lon, in_index in sorted(matches[metro], key=lambda r: (not r[4], r[0])):
                  if in_index:
                      picks.append((metro, sid))
                      break
          if not picks and all_csvs:
              print("  no metro station resolved — falling back to the first indexed file")
              print("  PURELY to characterise the column layout. The station is NOT Austin's.")
              picks = [("LAYOUT-ONLY", all_csvs[0].rsplit(".", 1)[0])]
          if not picks:
              print("  NOTHING TO OPEN: section 3 resolved no station and section 2 returned no")
              print("  index, so this run establishes neither the mapping nor the layout. Those")
              print("  are two separate findings and this run has made neither — do not read the")
              print("  absence of a column list below as 'the normals files carry no CDD'.")

          for metro, sid in picks[:MAX_STATION_CSVS]:
              st, b = get(f"{ACCESS}{sid}.csv", f"{metro} normals csv {sid}")
              if not b:
                  continue
              counts["csvs"] += 1
              text = b.decode("utf-8", "replace")
              rows = list(csv.reader(io.StringIO(text)))
              if not rows:
                  print("    empty csv")
                  continue
              header = rows[0]
              print(f"    {len(rows) - 1} data row(s), {len(header)} column(s)")
              print(f"    header: {header}")
              dd = [h for h in header if re.search(r"(CLDD|HTDD|CDD|HDD|DEG|COOL|HEAT)", h, re.I)]
              print(f"    degree-day-looking columns: {dd or 'NONE'}")
              base = [h for h in header if re.search(r"BASE|B\d{2}", h, re.I)]
              print(f"    base-temperature-looking columns: {base or 'NONE'}")
              idmap = {h: i for i, h in enumerate(header)}
              for h in dd[:8]:
                  vals = [r[idmap[h]] for r in rows[1:] if len(r) > idmap[h]]
                  print(f"      {h}: {vals[:14]}")
              print("    first two data rows verbatim:")
              for r in rows[1:3]:
                  print(f"      {r}")

          # ── 5. CLIMATE AT A GLANCE — the national baseline's own basis ─────
          # Section 3 of the round decides whether a multiplier is a SOURCED
          # claim or THI analysis, and that turns entirely on whether the
          # national series states its base, its period and its aggregation.
          # This prints the metadata block rather than the values.
          hr("5. CLIMATE AT A GLANCE NATIONAL CDD — base, period, aggregation")
          for label, url in [
              ("national CDD, August, 2015-2026",
               "https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/national/time-series/110/cdd/1/8/2015-2026.json"),
              ("national CDD, 12-month, 1991-2020 (does it publish a normal?)",
               "https://www.ncei.noaa.gov/access/monitoring/climate-at-a-glance/national/time-series/110/cdd/12/12/1991-2020.json"),
          ]:
              st, b = get(url, label)
              if not b:
                  continue
              try:
                  j = json.loads(b.decode("utf-8", "replace"))
              except Exception:
                  print(f"    not JSON; first 400 bytes: {b[:400]!r}")
                  continue
              meta = {k: v for k, v in j.items() if k != "data"} if isinstance(j, dict) else {}
              print(f"    metadata block: {json.dumps(meta)[:1200]}")
              data = j.get("data") if isinstance(j, dict) else None
              if isinstance(data, dict):
                  items = list(data.items())
                  print(f"    {len(items)} period(s); first 3: {items[:3]}; last 3: {items[-3:]}")

          print(f"\nNOAA_PROBE2_STATUS=complete requests={counts['requests']} "
                f"ok={counts['ok']} failed={counts['failed']} station_csvs={counts['csvs']}")
          PY
