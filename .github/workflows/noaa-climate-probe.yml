              "www.saws.org", "saws.org",
              "www.austintexas.gov", "austintexas.gov",
              "www.waterqualitydata.us", "waterqualitydata.us",
              "data.epa.gov", "sdwis.epa.gov", "enviro.epa.gov",
              "www.ncei.noaa.gov", "www.ncdc.noaa.gov",
          }

          counts = {"requests": 0, "ok": 0, "failed": 0, "refused": 0, "pdfs": 0}

          def _crash(exc_type, exc, tb):
