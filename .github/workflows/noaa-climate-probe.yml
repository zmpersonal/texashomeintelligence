                          if dates:
                              print(f"    date range in response: {dates[0]} .. {dates[-1]}")
                              newest_seen[f"{ds}/{metro}"] = dates[-1]
                      print("    first two data rows verbatim:")
                      for r in rows[1:3]:
                          print(f"      {r}")

              hr("6. PUBLICATION LAG, measured against the runner date")
              if not newest_seen:
                  print("  No dated rows were returned, so no lag could be measured.")
              for k, v in sorted(newest_seen.items()):
                  m = re.search(r"(\d{4})-?(\d{2})-?(\d{2})", v)
                  if m:
