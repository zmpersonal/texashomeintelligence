              print("  Bexar would NOT refute Round 12 — it would mean radar saw a signature")
              print("  nobody reported. Whoever writes this up must say which product each")
              print("  number came from, exactly as rounds 19-19e had to learn to.")
              print()
              print("  If SWDI also shows nothing for Bexar, that is worth knowing before Roof")
              print("  Scan is built: San Antonio renders an honest empty state, and a tool whose")
              print("  headline reading is empty in one launch metro is a product decision, not")
