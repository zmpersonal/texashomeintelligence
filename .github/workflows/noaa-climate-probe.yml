                    f"failed={counts['failed']} refused={counts['refused']} "
                    f"crash={exc_type.__name__}: {exc}")
          sys.excepthook = _crash

          def hr(title):
              print("\n" + "=" * 74)
              print(title)
              print("=" * 74)

          def get(url, label="", ceil=SMALL):
              host = urllib.parse.urlparse(url).netloc.lower()
              if host not in ALLOWED_HOSTS:
                  counts["refused"] += 1
                  print(f"  [{label or 'GET'}] REFUSED — {host} is not a utility or federal host")
                  print(f"    {url}")
                  return None, None, host
              counts["requests"] += 1
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(ceil + 1)
                      trunc = len(body) > ceil
                      if trunc:
                          body = body[:ceil]
                      counts["ok"] += 1
                      ctype = r.headers.get("Content-Type", "?")
                      print(f"  [{label or 'GET'}] HTTP {r.status}, {len(body)} bytes, {ctype}"
                            + (" (TRUNCATED)" if trunc else ""))
                      print(f"    {url}")
                      return r.status, body, host
              except urllib.error.HTTPError as e:
                  counts["failed"] += 1
                  detail = b""
                  try:
                      detail = e.read(1200)
                  except Exception:
                      pass
                  print(f"  [{label or 'GET'}] HTTP {e.code} {e.reason}\n    {url}")
                  if detail:
                      print(f"    body: {detail[:500]!r}")
                  return e.code, None, host
              except Exception as e:
                  counts["failed"] += 1
                  print(f"  [{label or 'GET'}] FAILED {type(e).__name__}: {e}\n    {url}")
                  return None, None, host

          # Hardness appears either as grains per gallon or as mg/L of CaCO3.
          # Both spellings are matched and the UNITS ARE PRINTED WITH EVERY HIT,
          # because a bare number is unusable and 10 gpg and 171 mg/L are the
          # same water.
          HARD = re.compile(
              r"(hardness[^.\n]{0,160}?|[^.\n]{0,80}?hardness)"
              r"([\d,]+(?:\.\d+)?)\s*"
              r"(grains?(?:\s*per\s*gallon)?|gpg|mg/?l|ppm|milligrams?)", re.I)
          HARD_ANY = re.compile(r"hardness", re.I)

          def pdf_text(body):
              """Stdlib only: inflate each FlateDecode stream. Recovering nothing
              is a LIMIT OF THIS EXTRACTOR, never evidence the figure is absent."""
              out = []
              for m in re.finditer(rb"stream\r?\n(.*?)endstream", body, re.S):
                  try:
                      out.append(zlib.decompress(m.group(1)))
                  except Exception:
                      continue
              return b"\n".join(out).decode("utf-8", "replace")

