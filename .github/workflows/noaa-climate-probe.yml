          SWDI_MAX_HOURS = 744
          WINDOW_DAYS = 31
          MONTHS_BACK = 12

          METROS = {
              "austin":      {"point": (30.2672, -97.7431), "county": "Travis", "fips": "48453"},
              "san-antonio": {"point": (29.4241, -98.4936), "county": "Bexar",  "fips": "48029"},
          }
          PAD = 0.5

          ALLOWED_HOSTS = {
              "www.saws.org", "saws.org",
              "www.austintexas.gov", "austintexas.gov",
              "www.waterqualitydata.us", "waterqualitydata.us",
              "data.epa.gov",
              "www.ncei.noaa.gov", "www.ncdc.noaa.gov",
          }

          counts = {"requests": 0, "ok": 0, "http_error": 0, "no_response": 0, "refused": 0}

          def _crash(exc_type, exc, tb):
              import traceback
              traceback.print_exception(exc_type, exc, tb)
              print(f"\nR21B_PROBE_STATUS=error requests={counts['requests']} "
                    f"crash={exc_type.__name__}: {exc}")
          sys.excepthook = _crash

          def hr(t):
              print("\n" + "=" * 74); print(t); print("=" * 74)

          class Resp:
              """THREE states, not two.

              `answered` is True whenever the server produced an HTTP response of
              any status — including a 4xx or 5xx whose body explains what it
              disliked. Only a transport failure is `unreachable`. Round 21
              collapsed these and drew the wrong conclusion from its own log.
              """
              def __init__(self, status=None, body=None, host="", error=None, refused=False):
                  self.status, self.body, self.host = status, body, host
                  self.error, self.refused = error, refused
              @property
              def answered(self):
                  return self.status is not None
              @property
              def ok(self):
                  return self.status is not None and 200 <= self.status < 300 and self.body is not None
              @property
              def unreachable(self):
                  return self.status is None and not self.refused

          def get(url, label="", ceil=SMALL):
              host = urllib.parse.urlparse(url).netloc.lower()
              if host not in ALLOWED_HOSTS:
                  counts["refused"] += 1
                  print(f"  [{label or 'GET'}] REFUSED — {host} is not a utility or federal host")
                  return Resp(host=host, refused=True)
              counts["requests"] += 1
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(ceil + 1)[:ceil]
                      counts["ok"] += 1
                      print(f"  [{label or 'GET'}] HTTP {r.status}, {len(body)} bytes, "
                            f"{r.headers.get('Content-Type', '?')}")
                      print(f"    {url}")
                      return Resp(r.status, body, host)
              except urllib.error.HTTPError as e:
                  counts["http_error"] += 1
                  try:
                      body = e.read(4000)
                  except Exception:
                      body = b""
                  print(f"  [{label or 'GET'}] HTTP {e.code} {e.reason} — THE SERVER ANSWERED.")
                  print(f"    {url}")
                  # Printed AND returned. Round 21 printed it and discarded it.
                  for line in body.decode("utf-8", "replace").splitlines()[:6]:
                      if line.strip():
                          print(f"    body: {line.strip()[:300]}")
                  return Resp(e.code, body, host, error=f"HTTP {e.code}")
              except Exception as e:
                  counts["no_response"] += 1
                  print(f"  [{label or 'GET'}] NO RESPONSE — {type(e).__name__}: {e}")
                  print(f"    {url}")
                  return Resp(host=host, error=f"{type(e).__name__}")

          def swdi_rows(body):
              """SWDI CSV comments start with '#'. Returns (header, rows)."""
              lines = [l for l in body.decode("utf-8", "replace").splitlines()
                       if l.strip() and not l.startswith("#")]
              if not lines:
                  return None, []
              rows = list(csv.reader(io.StringIO("\n".join(lines))))
              return rows[0], rows[1:]

          today = datetime.date.today()
          print(f"probe date (runner UTC): {today.isoformat()}")
          print(f"SWDI stated limit: {SWDI_MAX_HOURS} hours = {SWDI_MAX_HOURS // 24} days; "
                f"this probe uses {WINDOW_DAYS}-day windows")

          # ══ PART 1 — SWDI, CORRECTLY WINDOWED ═════════════════════════════
          hr("1. REACHABILITY, classified in three states")
          BASES = [("ncdc", "https://www.ncdc.noaa.gov/swdiws"),
                   ("ncei", "https://www.ncei.noaa.gov/swdiws")]
          w_end = today
          w_start = today - datetime.timedelta(days=WINDOW_DAYS)
          probe_bbox = "-98.0,29.9,-97.4,30.6"
          working_base = None
          for blabel, base in BASES:
              r = get(f"{base}/csv/nx3hail/{w_start:%Y%m%d}:{w_end:%Y%m%d}?bbox={probe_bbox}",
                      f"{blabel} nx3hail, {WINDOW_DAYS}-day window")
              state = ("OK" if r.ok else
                       "ANSWERED WITH AN ERROR" if r.answered else
                       "REFUSED BY ALLOWLIST" if r.refused else "NO RESPONSE")
              print(f"    -> {state}")
              if r.ok and working_base is None:
                  working_base = base
                  head = r.body[:400].decode("utf-8", "replace")
                  print("    first 400 bytes:")
                  for line in head.splitlines()[:6]:
                      print(f"      {line}")
                  print("    NO TOKEN WAS SENT on this request. If the body above is data,"
                        " the service is open; if it names a key, read that instead.")
          if working_base is None:
              print("\n  No base returned data. Read the state of each line above before")
              print("  concluding anything: 'ANSWERED WITH AN ERROR' means the service is")
              print("  reachable and rejected the request, which is a parameter problem,")
              print("  NOT an unreachable source. That distinction is this round's whole point.")

          # ── 2/3/4. Columns, coordinates, units, county — per dataset, never merged.
          # nx3hail is RADAR-DERIVED. plsr is HUMAN REPORTS. Different products.
          newest = {}
          totals = {}
          if working_base:
              for ds in ("nx3hail", "plsr"):
                  hr(f"2. SWDI {ds} — columns, coordinates, units, county (live)")
                  for metro, meta in METROS.items():
                      lat, lon = meta["point"]
                      bbox = f"{lon - PAD:.4f},{lat - PAD:.4f},{lon + PAD:.4f},{lat + PAD:.4f}"
                      r = get(f"{working_base}/csv/{ds}/{w_start:%Y%m%d}:{w_end:%Y%m%d}?bbox={bbox}",
                              f"{ds} {metro} ({meta['county']} Co. area)", ceil=BIG)
                      if not r.ok:
                          continue
                      header, rows = swdi_rows(r.body)
                      if header is None:
                          print(f"    NO DATA ROWS in this {WINDOW_DAYS}-day window. A finding,"
                                f" not an error.")
                          continue
                      idx = {h.strip().upper(): i for i, h in enumerate(header)}
                      print(f"    {len(rows)} row(s), {len(header)} column(s)")
                      print(f"    COLUMNS AS RETURNED: {header}")
                      latc = next((idx[k] for k in idx if k in ("LAT", "LATITUDE")), None)
                      lonc = next((idx[k] for k in idx if k in ("LON", "LONGITUDE")), None)
                      print(f"    per-record lat/lon: "
                            f"{'YES' if latc is not None and lonc is not None else 'NO'}")
                      sizec = [h for h in header if re.search(r"size|magnitude|sever|prob", h, re.I)]
                      print(f"    size/magnitude columns: {sizec or 'NONE'}")
                      for h in sizec[:4]:
                          vals = [x[idx[h.strip().upper()]] for x in rows[:20]
                                  if len(x) > idx[h.strip().upper()]]
                          print(f"      {h}: {vals[:12]}")
                      unitc = [h for h in header if re.search(r"^unit|units$|_unit", h.strip(), re.I)]
                      if unitc:
                          for h in unitc:
                              vals = sorted({x[idx[h.strip().upper()]] for x in rows
                                             if len(x) > idx[h.strip().upper()]})
                              print(f"    UNITS COLUMN PRESENT — {h}: {vals[:8]}")
                      else:
                          print("    NO UNITS COLUMN. The size column's unit must be read from")
                          print("    SWDI documentation before publication — inches and")
                          print("    millimetres differ by 25x and both look plausible.")
                      countyc = [h for h in header if re.search(r"county|fips", h, re.I)]
                      print(f"    county/FIPS columns: {countyc or 'NONE'}"
                            + ("" if countyc else "  <- a county rollup would have to be derived"
                                                  " from lat/lon, not read"))
                      datec = next((idx[k] for k in idx if "TIME" in k or "DATE" in k), None)
                      if datec is not None:
                          ds_dates = sorted(x[datec] for x in rows
                                            if len(x) > datec and x[datec].strip())
                          if ds_dates:
                              print(f"    date range: {ds_dates[0]} .. {ds_dates[-1]}")
                              newest[f"{ds}/{metro}"] = ds_dates[-1]
                      print(f"    first two rows verbatim:")
                      for x in rows[:2]:
                          print(f"      {x}")

              # ── 5. What a twelve-month picture costs, MEASURED.
              hr(f"3. COST OF A 12-MONTH PICTURE — {MONTHS_BACK} x {WINDOW_DAYS}-day requests")
              t0 = time.time()
              made = 0
              for ds in ("nx3hail", "plsr"):
                  for metro, meta in METROS.items():
                      lat, lon = meta["point"]
                      bbox = f"{lon - PAD:.4f},{lat - PAD:.4f},{lon + PAD:.4f},{lat + PAD:.4f}"
                      total = 0
                      empty = 0
                      for m in range(MONTHS_BACK):
                          end = today - datetime.timedelta(days=WINDOW_DAYS * m)
                          start = end - datetime.timedelta(days=WINDOW_DAYS)
                          r = get(f"{working_base}/csv/{ds}/{start:%Y%m%d}:{end:%Y%m%d}?bbox={bbox}",
                                  f"{ds} {metro} {start:%Y-%m-%d}..{end:%Y-%m-%d}", ceil=BIG)
                          made += 1
                          if not r.ok:
                              continue
                          header, rows = swdi_rows(r.body)
                          if header is None:
                              empty += 1
                              continue
                          total += len(rows)
                          d = next((i for i, h in enumerate(header)
                                    if "TIME" in h.upper() or "DATE" in h.upper()), None)
                          if d is not None:
                              got = sorted(x[d] for x in rows if len(x) > d and x[d].strip())
                              if got:
                                  prev = newest.get(f"{ds}/{metro}", "")
                                  if got[-1] > prev:
                                      newest[f"{ds}/{metro}"] = got[-1]
                      totals[f"{ds}/{metro}"] = (total, empty)
                      print(f"    == {ds} {metro} ({meta['county']} Co. area): {total} record(s) "
                            f"across {MONTHS_BACK} windows, {empty} empty window(s)")
              elapsed = time.time() - t0
              print(f"\n  MEASURED: {made} request(s) in {elapsed:.1f}s "
                    f"({elapsed / max(made, 1):.2f}s each).")
              print(f"  A full 12-month BACKFILL costs {MONTHS_BACK} requests per metro per")
              print(f"  dataset = {MONTHS_BACK * len(METROS) * 2} requests, ONCE.")
              print("  An INCREMENTAL run needs one window per metro per dataset =")
              print(f"  {len(METROS) * 2} requests, which is the number that recurs.")
              print("  COST.md asks for boring, cheap and reliable and caps nothing here:")
              print("  SWDI is free, unauthenticated, and this is Actions minutes only.")
              print("  Judge the recurring number, not the backfill.")

              # ── 6. Lag.
              hr("4. PUBLICATION LAG, measured against the runner date")
              if not newest:
                  print("  No dated rows in any window, so no lag could be measured.")
              for k, v in sorted(newest.items()):
                  m = re.search(r"(\d{4})-?(\d{2})-?(\d{2})", v)
                  if m:
                      d = datetime.date(int(m.group(1)), int(m.group(2)), int(m.group(3)))
                      print(f"  {k}: newest {d} — {(today - d).days} days behind the runner")
                  else:
                      print(f"  {k}: newest {v} (unparsed date shape)")

              hr("5. ROUND 12's BEXAR FINDING vs SWDI, over the same 12 months")
              for k, (total, empty) in sorted(totals.items()):
                  print(f"  {k}: {total} record(s), {empty}/{MONTHS_BACK} windows empty")
              print()
              print("  Round 12 measured NO HAIL IN BEXAR from NCEI Storm Events — county-level")
              print("  HUMAN REPORTS. nx3hail is RADAR-DERIVED signatures; plsr is human")
              print("  reports. A non-zero nx3hail count over Bexar would NOT refute Round 12;")
              print("  it would mean radar saw a signature nobody reported. Say which product")
              print("  each number came from.")
              print()
              print("  CONTEXT, and it makes an empty result the EXPECTED one: Texas hail")
              print("  frequency rises sharply north toward Dallas-Fort Worth. Austin sits at")
              print("  the southern edge of that gradient and San Antonio largely outside it.")
              print("  The owner has approved an honest 'no hail recorded in this window'")
              print("  state, so zero is a usable finding for Roof Scan, not a blocker.")

          # ══ PART 2 — HARDNESS ═════════════════════════════════════════════
          # ── 7. WQP: what the sampling locations ARE.
          hr("6. USGS WATER QUALITY PORTAL — what is actually being sampled")
          for metro, meta in METROS.items():
              q = urllib.parse.urlencode({
                  "countycode": f"US:48:{meta['fips'][2:]}",
                  "characteristicName": "Hardness, Ca, Mg",
                  "mimeType": "csv", "zip": "no",
                  "dataProfile": "resultPhysChem", "startDateLo": "01-01-2015",
              })
              r = get(f"https://www.waterqualitydata.us/data/Result/search?{q}",
                      f"WQP {meta['county']} County", ceil=BIG)
              if not r.ok:
                  continue
              rows = list(csv.reader(io.StringIO(r.body.decode("utf-8", "replace"))))
              if not rows:
                  print("    empty CSV"); continue
              header, body = rows[0], rows[1:]
              idx = {h: i for i, h in enumerate(header)}
              print(f"    [{r.host}] {len(body)} row(s), {len(header)} column(s)")
              def cell(row, name):
                  i = idx.get(name)
                  return row[i].strip() if i is not None and len(row) > i else ""
              # THE QUESTION THIS SECTION EXISTS FOR: is this tap water?
              for col in ("ActivityMediaName", "ActivityMediaSubdivisionName",
                          "MonitoringLocationTypeName"):
                  if col in idx:
                      vals = {}
                      for x in body:
                          vals[cell(x, col)] = vals.get(cell(x, col), 0) + 1
                      print(f"    {col}: {sorted(vals.items(), key=lambda kv: -kv[1])[:8]}")
                  else:
                      print(f"    {col}: COLUMN NOT PRESENT in this profile")
              # THE SAME TRAP AS ROUNDS 19-19e, ONE PRODUCT OVER. WQP's Result
              # profile and its Station profile are different products with
              # different columns; MonitoringLocationName may live only in the
              # latter. Absent columns are REPORTED, never keyed on as blanks —
              # a table of empty names would look like "we found nothing".
              missing = [c for c in ("MonitoringLocationIdentifier", "MonitoringLocationName")
                         if c not in idx]
              if missing:
                  print(f"    LOCATION COLUMNS ABSENT from this profile: {missing}")
                  print("    They are published by WQP's STATION profile "
                        "(/data/Station/search), a different request. Round 21b does not")
                  print("    assume its columns — it says they were not in what was read.")
              else:
                  names = {}
                  for x in body:
                      k = (cell(x, "MonitoringLocationIdentifier"), cell(x, "MonitoringLocationName"))
                      names[k] = names.get(k, 0) + 1
                  print(f"    {len(names)} distinct monitoring location(s); top 8 by row count:")
                  for (ident, name), n in sorted(names.items(), key=lambda kv: -kv[1])[:8]:
                      print(f"      {n:4d}  {ident or '(no id)'}  {name or '(no name)'}")
              vals = [(cell(x, "ResultMeasureValue"), cell(x, "ResultMeasure/MeasureUnitCode"))
                      for x in body]
              nums = [float(v) for v, u in vals if re.fullmatch(r"-?\d+(\.\d+)?", v or "")]
              if nums:
                  print(f"    value range: {min(nums)} .. {max(nums)}; "
                        f"units seen: {sorted({u for _, u in vals if u})[:5]}")
              print("    READ THIS BEFORE USING ANY OF IT: these are AMBIENT samples — the")
              print("    location names above say what they are. Ambient water is not what a")
              print("    tap delivers: it is untreated, and a utility blends and treats")
              print("    sources before delivery. A homeowner's softener sizing depends on")
              print("    the TREATED figure, so this series can describe a watershed but")
              print("    cannot answer 'how hard is my water'.")

          # ── 8. The utility pages Round 21 listed and never followed.
          hr("7. TREATED FIGURES — the pages Round 21 listed but did not open")
          # ROUND 21's SECOND DEFECT: candidate selection was `(pdfs or seen)[:3]`,
          # so the moment a landing page linked ANY pdf, every HTML candidate was
          # discarded. Austin Water publishes its treated hardness IN PAGE TEXT.
          # Both kinds are followed here.
          PAGES = [
              ("Austin Water quality reports", "https://www.austintexas.gov/page/water-quality-reports"),
              ("Austin Water dept page", "https://www.austintexas.gov/department/water-quality-reports"),
              ("SAWS water quality report", "https://www.saws.org/your-water/water-quality/water-quality-report/"),
              ("SAWS downloads", "https://www.saws.org/your-water/water-quality/download-water-quality-reports/"),
              ("SAWS mineral analysis", "https://www.saws.org/your-water/water-quality/mineral-analysis/"),
          ]
          # Round 21's matcher required NUMBER-then-UNIT. Austin's page is a TABLE
          # HEADER followed by values — "(ppm) [gpg] ... 70 [4.1] 126 [7.4]" — so
          # the unit precedes the numbers and nothing matched. Both orders now.
          VALUE_THEN_UNIT = re.compile(
              r"([\d,]+(?:\.\d+)?)\s*(grains?(?:\s*per\s*gallon)?|gpg|mg/?l|ppm)", re.I)
          UNIT_THEN_VALUES = re.compile(
              r"\(?\s*(ppm|mg/?l|gpg|grains?)\s*\)?\s*(?:\[\s*(ppm|mg/?l|gpg|grains?)\s*\])?", re.I)
          for label, url in PAGES:
              r = get(url, label)
              if not r.ok:
                  continue
              text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ",
                                                r.body.decode("utf-8", "replace")))
              spots = [m.start() for m in re.finditer(r"hardness", text, re.I)]
              print(f"    [{r.host}] {len(spots)} mention(s) of 'hardness'")
              for i, s in enumerate(spots[:4]):
                  window = text[max(0, s - 80):s + 320].strip()
                  print(f"      WINDOW {i + 1}: ...{window}...")
                  pairs = VALUE_THEN_UNIT.findall(window)
                  units = [u for grp in UNIT_THEN_VALUES.findall(window) for u in grp if u]
                  nums = re.findall(r"[\d,]+(?:\.\d+)?", window)
                  print(f"        value+unit pairs: {pairs[:6]}")
                  print(f"        units named in the window: {sorted(set(u.lower() for u in units))}")
                  print(f"        every number in the window, in order: {nums[:14]}")
                  print("        (a chemical formula contributes digits — the 3 of CaCO3 lands"
                        " in that list; read the window, not the list)")
              if not spots:
                  print("      no mention of 'hardness' on this page")
          print("\n  THE WINDOW IS PRINTED VERBATIM ON PURPOSE. Round 21's matcher wanted")
          print("  number-then-unit and a table header puts the unit first, so it reported")
          print("  zero where a figure was plainly present. A human reading the window above")
          print("  cannot be fooled that way; a regex reporting a count can.")

          print(f"\nR21B_PROBE_STATUS=complete requests={counts['requests']} ok={counts['ok']} "
                f"http_error={counts['http_error']} no_response={counts['no_response']} "
                f"refused={counts['refused']}")
          PY

      # ══ ROUND 23 — WHAT IS THE REAL WINDOW LIMIT, AND WHAT IS stat=count? ══
      #
      # TWO PIECES OF EVIDENCE CONTRADICT EACH OTHER AND ONLY ONE WAS MEASURED.
      #   MEASURED  : Round 21 asked nx3hail for 365 days and got HTTP 500,
      #               "maximum date range currently allowed is 744 hours" (31 days).
      #   DOCUMENTED: SWDI's REST usage page states "The current limit of the
      #               date range size is one year."
      #
      # Round 22 clamped to 31 days on the strength of the error, which was the
      # right call on the evidence available and may still be too tight. The
      # 744-hour ceiling may be specific to nx3hail, or to the SHAPE of Round
      # 21's request — which also carried `limit=5`, a parameter the working
      # Round 21b request did not send. That variable was never isolated.
      #
      # This section isolates it: 31 / 90 / 180 / 365 days, each WITH and
      # WITHOUT `limit`, every error body printed in full. It also characterises
      # stat=count and stat=countGroupBy, whose response SHAPES have never been
      # seen — the Round 23 fetcher parses the count defensively for exactly
      # that reason and records "unavailable" rather than guessing.
      #
      # NOTHING HERE CHANGES THE FETCHER. Raise MAX_WINDOW_DAYS against this
      # log, never against the documentation alone: the documentation is what
      # the 744-hour error already contradicted.
      - name: "TEMP (Round 23): SWDI window limit + stat=count semantics"
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import datetime, re, sys, urllib.request, urllib.error, urllib.parse

          UA = ("TexasHomeIntelligence-probe/1.0 (one-off read-only characterisation; "
                "contact via github.com/zmpersonal/texashomeintelligence)")
          TIMEOUT = 120
          CEIL = 24 * 1024 * 1024
          BASE = "https://www.ncdc.noaa.gov/swdiws"
          # The Austin box the fetcher uses: +/-0.5 deg around the zip-areas.ts
          # reference point. NOT a county.
          BBOX = "-98.2431,29.7672,-97.2431,30.7672"

          counts = {"requests": 0, "ok": 0, "http_error": 0, "no_response": 0}

          def _crash(t, e, tb):
              import traceback; traceback.print_exception(t, e, tb)
              print(f"\nR23_PROBE_STATUS=error requests={counts['requests']} crash={t.__name__}: {e}")
          sys.excepthook = _crash

          def hr(t):
              print("\n" + "=" * 74); print(t); print("=" * 74)

          def get(url, label=""):
              """Returns (status, body_text, kind). The BODY OF AN ERROR IS
              RETURNED, not just printed — Round 21 printed it, discarded it,
              and called a reachable service unreachable."""
              counts["requests"] += 1
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      body = r.read(CEIL).decode("utf-8", "replace")
                      counts["ok"] += 1
                      print(f"  [{label}] HTTP {r.status}, {len(body)} bytes")
                      return r.status, body, "ok"
              except urllib.error.HTTPError as e:
                  counts["http_error"] += 1
                  try:
                      body = e.read(8000).decode("utf-8", "replace")
                  except Exception:
                      body = ""
                  print(f"  [{label}] HTTP {e.code} {e.reason} — THE SERVER ANSWERED")
                  print("    FULL ERROR BODY:")
                  for line in body.splitlines()[:10]:
                      if line.strip():
                          print(f"      {line.strip()[:400]}")
                  if not body.strip():
                      print("      (empty body)")
                  return e.code, body, "http_error"
              except Exception as e:
                  counts["no_response"] += 1
                  print(f"  [{label}] NO RESPONSE — {type(e).__name__}: {e}")
                  return None, "", "no_response"

          def data_rows(body):
              """SWDI rows minus '#' comments and the totalTimeInSeconds trailer
              — the trailer Round 21b read as a date and Round 22 filtered."""
              lines = [l for l in body.splitlines()
                       if l.strip() and not l.startswith("#")
                       and not l.lower().startswith("totaltimeinseconds")]
              return max(0, len(lines) - 1), (lines[0] if lines else "")

          today = datetime.date.today()
          print(f"probe date (runner UTC): {today.isoformat()}")
          print(f"bbox: {BBOX}  (+/-0.5 deg around the Austin reference point — NOT a county)")

          # ── 1. THE WINDOW LIMIT, with `limit` isolated as a variable.
          hr("1. WINDOW LIMIT — 31 / 90 / 180 / 365 days, with and without `limit`")
          results = {}
          for days in (31, 90, 180, 365):
              for tag, extra in (("no limit", ""), ("with limit=5", "&limit=5")):
                  end = today
                  start = today - datetime.timedelta(days=days)
                  url = (f"{BASE}/csv/nx3hail/{start:%Y%m%d}:{end:%Y%m%d}"
                         f"?bbox={urllib.parse.quote(BBOX)}{extra}")
                  st, body, kind = get(url, f"{days}d, {tag}")
                  print(f"    {url}")
                  if kind == "ok":
                      n, header = data_rows(body)
                      print(f"    -> ACCEPTED: {n} data row(s); header: {header[:120]}")
                      results[(days, tag)] = ("accepted", n)
                  elif kind == "http_error":
                      hours = re.search(r"(\d+)\s*hours", body)
                      print(f"    -> REJECTED"
                            + (f"; the server named a ceiling of {hours.group(1)} hours"
                               if hours else "; no hour ceiling named in the body"))
                      results[(days, tag)] = ("rejected", st)
                  else:
                      results[(days, tag)] = ("no response", None)

          print("\n  SUMMARY — read this before touching MAX_WINDOW_DAYS:")
          for (days, tag), (verdict, extra) in sorted(results.items()):
              print(f"    {days:>3}d {tag:<14} {verdict}"
                    + (f" ({extra} rows)" if verdict == "accepted" else
                       f" (HTTP {extra})" if extra else ""))
          accepted = sorted({d for (d, t), (v, _) in results.items() if v == "accepted"})
          if accepted:
              print(f"\n  LONGEST ACCEPTED WINDOW: {max(accepted)} days.")
              if max(accepted) > 31:
                  print("  THAT CHANGES THE BACKFILL DECISION. Round 22 chose no backfill")
                  print("  because twelve 31-day requests of one-shot loop logic would run")
                  print("  their guard every day forever to do nothing. If one request covers")
                  print("  a year, a backfill is ONE request and that reasoning no longer")
                  print("  holds — raise MAX_WINDOW_DAYS and let computeFetchWindow's own")
                  print("  backfill window through unclamped.")
              else:
                  print("  31 days stands as the real ceiling for this query shape. Keep the")
                  print("  clamp and record that the documentation's 'one year' does not")
                  print("  describe nx3hail with a bbox.")
              if any(t == "no limit" for (d, t), (v, _) in results.items()
                     if v == "accepted" and d > 31) != any(
                     t == "with limit=5" for (d, t), (v, _) in results.items()
                     if v == "accepted" and d > 31):
                  print("  NOTE: `limit` CHANGED THE OUTCOME. Round 21's failing request")
                  print("  carried it and Round 21b's working request did not — that")
                  print("  variable was never isolated until now.")
          else:
              print("\n  NO WINDOW WAS ACCEPTED. Read the bodies above before concluding")
              print("  anything: a rejection is not unreachability.")

          # ── 2. stat=count semantics. The fetcher parses this defensively
          # because its shape has never been seen; this is what settles it.
          hr("2. stat=count — response shape, and whether it equals the row count")
          for days in (31, 90):
              start = today - datetime.timedelta(days=days)
              plain = (f"{BASE}/csv/nx3hail/{start:%Y%m%d}:{today:%Y%m%d}"
                       f"?bbox={urllib.parse.quote(BBOX)}")
              st, body, kind = get(plain, f"{days}d records")
              rows = data_rows(body)[0] if kind == "ok" else None
              st2, cbody, kind2 = get(plain + "&stat=count", f"{days}d stat=count")
              if kind2 == "ok":
                  print("    RESPONSE VERBATIM:")
                  for line in cbody.splitlines()[:8]:
                      print(f"      {line[:200]}")
                  nums = re.findall(r"\d+", "\n".join(
                      l for l in cbody.splitlines()
                      if not l.startswith("#") and "totaltimeinseconds" not in l.lower()))
                  print(f"    integers found (excluding the timing trailer): {nums[:6]}")
                  if rows is not None and nums:
                      agree = int(nums[0]) == rows
                      print(f"    per-record rows: {rows}; stat=count first integer: {nums[0]}"
                            f"  -> {'AGREE' if agree else 'DISAGREE'}")
                      if not agree:
                          print("    A DISAGREEMENT HERE IS THE ANSWER TO ROUND 23's OPEN")
                          print("    QUESTION: it means stat=count counts something other than")
                          print("    the rows it returns, and the fetcher's cross-check must")
                          print("    STAY a warning rather than being promoted to a throw.")
                      else:
                          print("    AGREEMENT ON A LIVE RUN IS THE CONDITION Round 23 set for")
                          print("    promoting the cross-check from a warning to a hard failure.")

          # ── 3. countGroupBy. Assessed against the response, not from the name.
          hr("3. stat=countGroupBy — is a server-side monthly breakdown possible?")
          start = today - datetime.timedelta(days=31)
          plain = (f"{BASE}/csv/nx3hail/{start:%Y%m%d}:{today:%Y%m%d}"
                   f"?bbox={urllib.parse.quote(BBOX)}")
          for col in ("ZTIME", "WSR_ID", "MAXSIZE"):
              st, body, kind = get(f"{plain}&stat=countGroupBy:{col}", f"countGroupBy:{col}")
              if kind == "ok":
                  print("    RESPONSE (first 8 lines):")
                  for line in body.splitlines()[:8]:
                      print(f"      {line[:200]}")
                  print(f"    distinct groups returned: {max(0, len(body.splitlines()) - 2)}")
          print("\n  THE QUESTION IS NOT WHETHER IT GROUPS — IT IS WHETHER IT GROUPS BY MONTH.")
          print("  nx3hail's only time column is ZTIME, a full timestamp. Grouping by it")
          print("  yields one group per scan, not one per month, unless SWDI accepts a")
          print("  date-part expression — which the output above either shows or does not.")
          print("  If it does not, countGroupBy cannot replace anything the product needs,")
          print("  and the per-record fetch stays the source: coordinates, timestamps and")
          print("  MAXSIZE are what a per-address reading requires, and a count has none.")

          print(f"\nR23_PROBE_STATUS=complete requests={counts['requests']} ok={counts['ok']} "
                f"http_error={counts['http_error']} no_response={counts['no_response']}")
          PY
