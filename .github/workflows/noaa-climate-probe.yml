                          print("    in, it must be read from SWDI's documentation before anything")
                          print("    is published — inches and millimetres differ by 25x and both")
                          print("    look plausible on a hail report.")
                      countyc = [h for h in header if re.search(r"county|fips|wfo|state", h, re.I)]
                      print(f"    county/geography columns: {countyc or 'NONE'}")
                      datec = next((idx[k] for k in idx if "TIME" in k or "DATE" in k), None)
                      if datec is not None:
