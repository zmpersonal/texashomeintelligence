      # as an unavailable SOURCE. `get()` below returns the error body, and
      # reachability is classified in three states, never two.
      - name: "TEMP (Round 21b): SWDI within its 744-hour limit + hardness follow-through"
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import csv, io, json, re, sys, time, datetime
          import urllib.request, urllib.error, urllib.parse

          UA = ("TexasHomeIntelligence-probe/1.0 (one-off read-only characterisation; "
                "contact via github.com/zmpersonal/texashomeintelligence)")
          TIMEOUT = 90
          SMALL = 8 * 1024 * 1024
          BIG = 24 * 1024 * 1024

