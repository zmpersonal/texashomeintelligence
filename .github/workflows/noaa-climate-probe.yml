      #
      # 744 hours is 31 days; the probe asked for 365. The service was
      # reachable, parsed the request, and named the constraint. THE EVIDENCE
      # WAS IN THE LOG AND THE CODE IGNORED IT.
      #
      # THE STRUCTURAL DEFECT, which mattered more than the window. Round 21's
      # `get()` returns `(status, None, host)` on an HTTPError — it PRINTS the
