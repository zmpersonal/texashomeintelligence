                      print(f"  {k}: newest record {d} — {(today - d).days} days behind the runner")
                  else:
                      print(f"  {k}: newest record {v} (unparsed date shape)")

              hr("7. ROUND 12's BEXAR FINDING — confirmed or refuted, and Travis alongside")
              print("  Round 12 measured, from NCEI Storm Events (county-level, human reports),")
