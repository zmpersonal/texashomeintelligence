      # ══ ROUND 21b — I CALLED A REACHABLE SERVICE UNREACHABLE. ══════════
      #
      # Round 21 reported "NEITHER SWDI BASE ANSWERED" and stopped. Both bases
      # answered. Both returned, in the response body my own `get()` printed:
      #
      #   ERROR VALIDATING 'dateRange=startDate:endDate'. 'startDate' must be a
