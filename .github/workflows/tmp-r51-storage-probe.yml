# TEMPORARY — Round 51. Delete when the round is decided.
#
# No external host is reachable from an agent session, and Actions logs are served from a host it
# cannot follow a redirect to — so the probe WRITES AND COMMITS its measurement. Read-only on the
# datasets: a step below fails the run if anything under src/data/generated moved.
name: tmp r51 storage-series probe

on:
  push:
    branches: [claude/thi-plan-review-m40n0x]
    paths:
      - "site/scripts/audits/round-51-storage-series.ts"
      - ".github/workflows/tmp-r51-storage-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      - name: Read the storage series, both metros
        working-directory: site
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npx tsx scripts/audits/round-51-storage-series.ts

      - name: The probe must not have written a dataset file
        run: |
          if ! git diff --quiet -- site/src/data/generated; then
            echo "::error::the probe modified site/src/data/generated — it is read-only by design"
            exit 1
          fi

      - name: No permit description may appear in the measurement
        # The standing line from Round 50: a probe writes the measurement, not the material.
        # Asserted rather than trusted. It reports the JSON PATH of any offender and never the
        # offending text — a guard against publishing free text must not publish it to complain,
        # and an Actions log this session cannot read is not a record either, so the paths are
        # written to a file that gets committed whether or not the check passes.
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          src = pathlib.Path("docs/audits/round-51-storage.json")
          if not src.exists():
              print("no measurement written; nothing to check"); sys.exit(0)
          d = json.loads(src.read_text())
          hits = []
          def walk(o, path="$"):
              if isinstance(o, dict):
                  for k, v in o.items():
                      # A KEY can be free text too (a permit type is fine; a description is not).
                      if isinstance(k, str) and len(k) >= 60 and k.count(" ") >= 6:
                          hits.append({"path": f"{path}.<key>", "length": len(k), "spaces": k.count(" ")})
                      walk(v, f"{path}.{k}")
              elif isinstance(o, list):
                  for i, v in enumerate(o): walk(v, f"{path}[{i}]")
              elif isinstance(o, str) and len(o) >= 60 and o.count(" ") >= 6:
                  hits.append({"path": path, "length": len(o), "spaces": o.count(" ")})
          walk(d)
          hits = [h for h in hits if not h["path"].endswith(".question")]
          pathlib.Path("docs/audits/round-51-textcheck.json").write_text(
              json.dumps({"offenders": hits, "note":
                          "paths and shapes only; the matched text is deliberately absent"},
                         indent=2) + "\n")
          for h in hits[:10]: print("  offender:", h)
          print(f"{len(hits)} offender(s)")
          sys.exit(1 if hits else 0)
          PY

      - name: Commit the measurement
        if: always()
        run: |
          git config user.name  "thi-probe"
          git config user.email "noreply@texashomeintelligence.com"
          git add docs/audits/round-51-storage.json docs/audits/round-51-textcheck.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Round 51 probe result: the Austin storage series

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          for i in 1 2 3 4; do git push origin HEAD:${GITHUB_REF_NAME} && break || sleep $((2**i)); done
