name: Citation link check

# Checks that every external URL the site CITES still resolves. One HEAD request
# per distinct cited URL — ten today — once a week.
#
# ── WHY THIS IS A WORKFLOW AND NOT PART OF `npm run build` ────────────────
# Because a build must not depend on the internet. Workers Builds runs on every
# push to `main`, so putting this in the build would (a) make a deploy fail for
# reasons unrelated to the commit — a government site down for maintenance would
# block a release — and (b) turn "check a few links" into polling at whatever
# rate anyone happens to commit. It also cannot run in the agent sandbox, where
# every one of these hosts is proxy-denied, so it would fail every local build
# for a reason that has nothing to do with the code.
#
# ── THE COST, AGAINST COST.md RULE 3 ──────────────────────────────────────
# ~10 HEAD requests a week — about 520 a year, roughly one per site per week — on
# free Action minutes. No response body is read and nothing is stored. Rule 3
# governs the INGESTION path, where request volume scales with data refresh and
# the result becomes a number on a page. This touches no dataset, runs on a fixed
# weekly clock regardless of traffic or commits, and its only output is a GitHub
# issue for a human. If it never ran, no number on the site would change.
#
# ── TWO DIFFERENT FAILURES, TWO DIFFERENT ISSUES (Round 15b) ──────────────
# "A cited URL is dead" and "the checker never ran" are unrelated findings with
# unrelated fixes, and this job used to report both as the first one: any
# non-zero exit opened an issue titled "one or more cited URLs did not resolve"
# and pasted whatever the run printed.
#
# That is not hypothetical. Round 14b gave belowHero.ts a Vite-only `?raw`
# import; this script imports belowHero.ts; from that commit it died on startup
# with a SyntaxError. Every Monday afterwards this job would have announced a
# dead citation and offered a stack trace as the evidence.
#
# The discriminator is the STATUS SENTINEL the script prints, not the exit
# code — measured: a dead-link run and a startup crash BOTH exit 1. Only a run
# that got far enough to have an answer can print the sentinel, so its absence
# is the crash signal and nothing else can forge it.
#
# ── WHAT A PASS MEANS, AND WHAT IT DOES NOT ───────────────────────────────
# That the URL responded on that date. NOT that the page still says what we cite
# it for. That second question is `reviewEveryDays` in serviceNotices.ts, which
# fails the BUILD when a dated claim ages past its cadence. Neither mechanism
# substitutes for the other: one catches a link rotting, the other a fact.
#
# It opens an issue; it never fails a build or a deploy. A red X on a scheduled
# job is a thing people stop seeing — an issue is a thing with an assignee.

on:
  schedule:
    # Mondays 14:00 UTC — 09:00 America/Chicago in CDT, 08:00 in CST. Start of
    # the week, so a dead citation gets found on a working day rather than
    # sitting over a weekend.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: citation-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Check cited URLs
        id: check
        working-directory: site
        # Never fails the job — the report is the product, and the issue steps
        # below decide what to do with it.
        continue-on-error: true
        run: |
          set +e
          # `--import ./scripts/register-raw.mjs` teaches Node the `?raw` suffix
          # `src/data/belowHero.ts` uses to derive its dataset citations from the
          # fetchers. Without it this step dies on startup with a SyntaxError and
          # the issue below reports a stack trace instead of a link report — which
          # is exactly what it did between Round 14b and Round 15.
          #
          # Both streams are merged into the report: the sentinel goes to stdout
          # in human mode, but a crash writes only to stderr, and the crash is
          # the case this classification exists for.
          npx tsx --import ./scripts/register-raw.mjs scripts/check-citations.ts \
            > "$RUNNER_TEMP/report.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/report.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          # THE CLASSIFICATION. Sentinel absent => the checker never produced an
          # answer, whatever it exited with. Sentinel present => trust what it
          # says. Never infer "dead link" from an exit code alone: a dead-link
          # run and a startup crash both exit 1.
          status=$(grep -o 'CITATION_CHECK_STATUS=[a-z]*' "$RUNNER_TEMP/report.txt" \
            | tail -1 | cut -d= -f2)
          if [ -z "$status" ]; then status=crashed; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "::notice title=Citation check::status=$status exit=$code"

      - name: Open an issue if any citation is dead
        if: steps.check.outputs.status == 'dead'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Citation link check: one or more cited URLs did not resolve"
        run: |
          set -euo pipefail
          # One open issue at a time. A new one every Monday for the same dead
          # link is how a useful signal becomes noise people filter out.
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')

          {
            echo "The weekly citation link check found a URL that did not resolve."
            echo
            echo "A failure here means the URL did not respond, **not** that the claim is wrong."
            echo "Conversely a pass would mean only that the URL responded — whether the page still"
            echo "says what we cite it for is what \`reviewEveryDays\` answers, separately."
            echo
            echo "Fix by replacing the URL in \`site/src/data/belowHero.ts\` (\`SourceRef.url\`) or"
            echo "\`site/src/data/serviceNotices.ts\` (\`ServiceNotice.sourceUrl\`), and set"
            echo "\`checkedByHumanOn\` to the date you opened the replacement."
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      # ── THE OTHER FAILURE ────────────────────────────────────────────────
      # The checker did not produce an answer. Its own title, so it can never be
      # mistaken for — or collapsed into — a dead-link issue, and so the two do
      # not overwrite each other's comment thread. `error` means the script
      # caught its own failure; `crashed` means it never got far enough to say
      # anything, which is the Round 14b shape.
      - name: Open an issue if the checker itself failed
        if: steps.check.outputs.status == 'crashed' || steps.check.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Citation link check: the checker did not run"
          STATUS: ${{ steps.check.outputs.status }}
          CODE: ${{ steps.check.outputs.exit_code }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')

          {
            echo "**The citation checker did not complete. This says nothing about the citations.**"
            echo
            echo "No cited URL has been reported dead here — the check never reached an answer,"
            echo "so the state of every citation is simply unknown until this is fixed."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| classification | \`$STATUS\` |"
            echo "| process exit code | \`$CODE\` |"
            echo "| status sentinel | $( [ "$STATUS" = crashed ] && echo 'absent — the script never printed one' || echo 'present, reporting its own failure' ) |"
            echo
            echo "\`crashed\` means the script did not get far enough to print"
            echo "\`CITATION_CHECK_STATUS\`. The likeliest cause is the one this guard was built for:"
            echo "**a module the script imports gained a build-tool-only import that plain Node cannot"
            echo "load.** \`site/src/data/belowHero.ts\` derives its dataset citations with Vite's"
            echo "\`?raw\` suffix, which is why this job runs the script through"
            echo "\`--import ./scripts/register-raw.mjs\`. If a new \`?raw\`-style import appears"
            echo "somewhere that hook does not cover, this is what it looks like."
            echo
            echo "Reproduce and fix locally:"
            echo
            echo '```'
            echo "cd site"
            echo "npx tsx scripts/replays/citationcheckunit.ts   # the replay that guards this"
            echo "npx tsx --import ./scripts/register-raw.mjs scripts/check-citations.ts"
            echo '```'
            echo
            echo '```'
            tail -c 8000 "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > "$RUNNER_TEMP/crash.md"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/crash.md"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/crash.md"
          fi
