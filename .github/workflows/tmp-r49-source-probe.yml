# TEMPORARY — Round 49. Delete when the round lands.
#
# No external host is reachable from a Claude Code session, so every reachability claim in the
# round's audit is measured here or stated as unmeasured. Read-only: a step below fails the run
# if the probe wrote anything under src/data/generated.
name: tmp r49 source-verifiability probe

on:
  push:
    branches: [claude/thi-plan-review-m40n0x]
    paths:
      - "site/scripts/audits/round-49-source-verifiability-probe.ts"
      - ".github/workflows/tmp-r49-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: write   # the probe commits its own measurement back to the branch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: The autoposter's dependencies
        run: pip install pyyaml

      - name: The verifier, against the real sources, for every live transcribed claim
        working-directory: autoposter
        run: |
          python3 - <<'EOF'
          import sys; sys.path.insert(0, "src")
          from datetime import date
          import article_engine as engine, run_article, source_check
          cfg, feed = engine.load_config(), engine.load_feed()
          for name, fn in (("power", run_article.build_power_claims),
                           ("ac-rush", run_article.build_acrush_claims)):
              claims = fn(feed, cfg, date(2026, 10, 12))
              summary = source_check.check_all(claims)
              print(f"--- {name}: {summary['counts']}")
              for c in claims:
                  if c.verified:
                      print(f"    {c.id:<5} {c.tier:<9} {c.figure!r:<34} {c.verified}")
              assert not summary["unverified"], summary["unverified"]
          EOF
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Probe the five sources behind every published claim
        working-directory: site
        run: npx tsx scripts/audits/round-49-source-verifiability-probe.ts --out ../docs/audits/round-49-probe.json
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - name: The probe must not have written to the data it audits
        working-directory: site
        run: |
          if ! git diff --quiet -- src/data/generated; then
            echo "PROBE WROTE TO THE DATA IT IS AUDITING — failing."
            git diff --stat -- src/data/generated
            exit 1
          fi
          echo "clean"

      - name: Commit the measurement, so it can be read back
        run: |
          git config user.name "thi-autoposter"
          git config user.email "noreply@anthropic.com"
          git add docs/audits/round-49-probe.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Round 49 probe result: measured source verifiability"
          # Rebase first. Round 47 lost a complete ingestion to a push race when a commit
          # landed on the branch from the session while the job ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
