# TEMPORARY — Round 41c probe. DELETE BEFORE THE ROUND ENDS.
#
# Measures whether four per-metro feeds can resolve per LOCATION, and — the part
# that actually decides it — how far the nearest real source is from New
# Braunfels and San Marcos. A station 60 miles away is the metro's reading with
# a city's name on it, which is the defect Round 41a just fixed.
#
# City coordinates come from the Census Gazetteer, not from memory. Nothing in
# this repo may carry a lat/lon nobody sourced.
#
# Robots compliance is enforced in code, carried over from Round 39: every
# robots.txt is fetched first, the `User-agent: *` group is parsed with
# longest-match Allow/Disallow precedence over path AND query, and a disallowed
# path is recorded as SKIPPED_BY_ROBOTS rather than fetched.
name: TEMPORARY per-location feed probe (Round 41c)

on:
  push:
    branches: [claude/thi-v3-round41c-per-location]
    paths: ['.github/workflows/tmp-perloc-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe per-location resolution
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          mkdir -p tmp/perloc/robots
          python3 - <<'PY'
          import json, os, re, math, csv, io, urllib.parse, urllib.request, collections

          UA = 'TexasHomeIntelligence-probe/1.0 (one-off research; texashomeintelligence.com)'
          OUT = 'tmp/perloc'
          log = []
          def get(url, timeout=90):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read()
              except Exception as e:
                  code = getattr(e, 'code', 0)
                  return code, str(e).encode()

          # ---- robots: parse the User-agent: * group properly ----
          robots_cache = {}
          def star_rules(host):
              if host in robots_cache: return robots_cache[host]
              st, body = get(f'https://{host}/robots.txt', timeout=30)
              txt = body.decode('utf-8', 'replace') if st == 200 else ''
              open(f'{OUT}/robots/{host}.txt', 'w').write(txt if st == 200 else f'(HTTP {st})')
              groups, cur, agents = [], None, []
              for line in txt.splitlines():
                  l = line.split('#')[0].strip()
                  # ⚠️ A BLANK LINE ENDS A GROUP (RFC 9309 §2.2.1). Pass 1 skipped
                  # blank lines, so on www2.census.gov — which opens with a bare
                  # `User-agent: *` and no rules, then a blank line, then
                  # `User-agent: RavenCrawler` / `Disallow: /` — it merged the two
                  # and refused the whole host to everyone. A guard that errs
                  # toward refusing still produces a false finding.
                  if not l:
                      if cur is not None and cur['rules']:
                          groups.append(cur)
                          cur = None
                      continue
                  k, _, v = l.partition(':')
                  k, v = k.strip().lower(), v.strip()
                  if k == 'user-agent':
                      if cur is not None and cur['rules']:
                          groups.append(cur); cur = None
                      if cur is None: cur = {'agents': [], 'rules': []}
                      cur['agents'].append(v)
                  elif cur is not None and k in ('allow', 'disallow'):
                      cur['rules'].append((k, v))
              if cur is not None: groups.append(cur)
              dis = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'disallow' and v]
              allow = [v for g in groups if '*' in g['agents'] for k, v in g['rules'] if k == 'allow' and v]
              robots_cache[host] = (st, dis, allow)
              return robots_cache[host]

          def match(rule, path):
              pat = re.escape(rule).replace(r'\*', '.*')
              if pat.endswith(r'\$'): return re.match('^' + pat[:-2] + '$', path) is not None
              return re.match('^' + pat, path) is not None

          def allowed(url):
              u = urllib.parse.urlparse(url)
              st, dis, allow = star_rules(u.netloc)
              # Path AND query. Round 39 pass 4: Dallas' rules were query-scoped
              # (`Disallow: /browse?*&q=`) and a path-only match ignored them all.
              path = (u.path or '/') + (f'?{u.query}' if u.query else '')
              d = [r for r in dis if match(r, path)]
              a = [r for r in allow if match(r, path)]
              # longest-match wins; Allow beats Disallow at equal length
              if d and (not a or max(len(x) for x in a) < max(len(x) for x in d)):
                  return False, d
              return True, []

          def fetch(url, label):
              ok, why = allowed(url)
              if not ok:
                  log.append({'url': url, 'label': label, 'status': 'SKIPPED_BY_ROBOTS', 'disallowed_by': why})
                  return None
              st, body = get(url)
              log.append({'url': url, 'label': label, 'status': st, 'bytes': len(body)})
              return body if st == 200 else None

          def jparse(b, label):
              try:
                  return json.loads(b), None
              except Exception as e:
                  return None, {'parse_error': str(e), 'body_prefix': b[:200].decode('utf-8', 'replace')}

          def miles(a_lat, a_lon, b_lat, b_lon):
              R = 3958.7613
              p1, p2 = math.radians(a_lat), math.radians(b_lat)
              dp, dl = math.radians(b_lat - a_lat), math.radians(b_lon - a_lon)
              h = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2 * R * math.asin(math.sqrt(h))

          F = collections.defaultdict(dict)

          # ---- 0 · CITY COORDINATES, SOURCED ----------------------------------
          # Census Gazetteer place file: INTPTLAT/INTPTLONG is the Census
          # Bureau's own internal point for the place. Nothing here is typed
          # from memory.
          GAZ = ('https://www2.census.gov/geo/docs/maps-data/data/gazetteer/'
                 '2023_Gazetteer/2023_gaz_place_48.txt')
          b = fetch(GAZ, 'gazetteer:tx-places')
          POINTS = {}
          if b:
              txt = b.decode('latin-1')
              rdr = csv.DictReader(io.StringIO(txt), delimiter='\t')
              want = {'New Braunfels city', 'San Marcos city', 'Austin city', 'San Antonio city'}
              for row in rdr:
                  name = (row.get('NAME') or '').strip()
                  if name in want:
                      POINTS[name] = {
                          'geoid': (row.get('GEOID') or '').strip(),
                          'lat': float(row['INTPTLAT']), 'lon': float(row['INTPTLONG'].strip()),
                          'aland_sqmi': (row.get('ALAND_SQMI') or '').strip(),
                      }
              F['points'] = POINTS
              F['points_source'] = GAZ

          # THI's own committed metro points, to measure separation against.
          METRO = {'austin': (30.2672, -97.7431), 'san-antonio': (29.4241, -98.4936)}
          if POINTS:
              sep = {}
              for city, key in [('New Braunfels', 'New Braunfels city'), ('San Marcos', 'San Marcos city')]:
                  if key not in POINTS: continue
                  p = POINTS[key]
                  sep[city] = {m: round(miles(p['lat'], p['lon'], *c), 1) for m, c in METRO.items()}
              F['city_to_metro_point_miles'] = sep

          # ---- 1 · AIR QUALITY -------------------------------------------------
          # The endpoint takes a ZIP, but answers with a REPORTING AREA. If a
          # corridor ZIP answers "San Antonio", the reading IS the metro's and
          # may not wear a city's name.
          key = os.environ.get('AIRNOW_API_KEY', '')
          F['airnow']['has_key'] = bool(key)
          if key:
              for zc, who in [('78701','Austin core'), ('78205','San Antonio core'),
                              ('78130','New Braunfels'), ('78132','New Braunfels'),
                              ('78666','San Marcos'), ('78640','Kyle')]:
                  u = ('https://www.airnowapi.org/aq/observation/zipCode/current/'
                       f'?format=application/json&zipCode={zc}&distance=25&API_KEY={key}')
                  bb = fetch(u, f'airnow:{zc}')
                  if bb is None:
                      F['airnow'][zc] = {'who': who, 'result': 'no 200'}
                      continue
                  v, err = jparse(bb, 'airnow')
                  F['airnow'][zc] = {'who': who, 'error': err} if err else {
                      'who': who,
                      'rows': [{'ReportingArea': r.get('ReportingArea'),
                                'StateCode': r.get('StateCode'),
                                'Latitude': r.get('Latitude'), 'Longitude': r.get('Longitude'),
                                'ParameterName': r.get('ParameterName'), 'AQI': r.get('AQI')}
                               for r in (v or [])]}

          # ---- 2 · COOLING LOAD: GHCND STATIONS -------------------------------
          # Same filter the fetcher uses (USW, first-order), plus distance from
          # each city's own point, plus whether a monthly-normals file exists.
          b = fetch('https://www.ncei.noaa.gov/pub/data/ghcn/daily/ghcnd-stations.txt', 'ghcnd:stations')
          stations = []
          if b:
              for line in b.decode('utf-8', 'replace').splitlines():
                  if len(line) < 72: continue
                  sid = line[0:11].strip()
                  if not sid.startswith('USW'): continue
                  try:
                      stations.append({'id': sid, 'lat': float(line[12:20]), 'lon': float(line[21:30]),
                                       'name': line[41:71].strip()})
                  except ValueError:
                      continue
              F['ghcnd']['usw_station_count'] = len(stations)

          idx = fetch('https://www.ncei.noaa.gov/data/normals-monthly/1991-2020/access/', 'ghcnd:normals-index')
          have_normals = set()
          if idx:
              have_normals = set(re.findall(r'([A-Z]{2}[A-Z0-9]{9})\.csv', idx.decode('utf-8', 'replace')))
              F['ghcnd']['normals_files'] = len(have_normals)

          targets = {'Austin city': 'austin core', 'San Antonio city': 'san antonio core',
                     'New Braunfels city': 'New Braunfels', 'San Marcos city': 'San Marcos'}
          for key_name, label in targets.items():
              if key_name not in POINTS: continue
              p = POINTS[key_name]
              near = sorted(
                  ({**s, 'mi': round(miles(p['lat'], p['lon'], s['lat'], s['lon']), 1)} for s in stations),
                  key=lambda s: s['mi'])[:6]
              F['ghcnd'][label] = [
                  {'id': s['id'], 'name': s['name'], 'miles': s['mi'],
                   'has_monthly_normals': s['id'] in have_normals} for s in near]

          # ---- 3 · HAIL: SWDI bounding box ------------------------------------
          # The fetcher already queries a bbox, so finer grain is free. What is
          # NOT free is meaning: a 0.5-degree pad around two points 30 miles
          # apart overlaps heavily, so two "local" counts would share most of
          # their area. Measure the counts and the overlap.
          PAD = 0.5
          def bbox(lat, lon, pad=PAD):
              return f'{lon-pad:.4f},{lat-pad:.4f},{lon+pad:.4f},{lat+pad:.4f}'
          WINDOW = '20260501:20260531'
          for key_name, label in targets.items():
              if key_name not in POINTS: continue
              p = POINTS[key_name]
              u = (f'https://www.ncdc.noaa.gov/swdiws/csv/nx3hail/{WINDOW}'
                   f'?bbox={urllib.parse.quote(bbox(p["lat"], p["lon"]))}&stat=count')
              bb = fetch(u, f'swdi:{label}')
              F['swdi'][label] = {'bbox': bbox(p['lat'], p['lon']),
                                  'count_body': bb.decode('utf-8', 'replace')[:300] if bb else None}
          # overlap of the corridor boxes with their metro's box, as a fraction
          if POINTS:
              def overlap_frac(a, b_, pad=PAD):
                  ow = max(0.0, min(a[1]+pad, b_[1]+pad) - max(a[1]-pad, b_[1]-pad))
                  oh = max(0.0, min(a[0]+pad, b_[0]+pad) - max(a[0]-pad, b_[0]-pad))
                  return round((ow*oh) / ((2*pad)*(2*pad)), 3)
              ov = {}
              for city, key_name, metro in [('New Braunfels', 'New Braunfels city', 'san-antonio'),
                                            ('San Marcos', 'San Marcos city', 'austin')]:
                  if key_name not in POINTS: continue
                  p = POINTS[key_name]
                  ov[city] = {'vs_' + metro: overlap_frac((p['lat'], p['lon']), METRO[metro])}
              F['swdi']['box_overlap_fraction'] = ov

          # ---- 4 · CENSUS ACS --------------------------------------------------
          # County today. ACS also publishes `for=place:`, which is the city
          # itself — genuinely finer, not just a different county.
          ck = os.environ.get('CENSUS_API_KEY', '')
          F['acs']['has_key'] = bool(ck)
          GET = 'NAME,B25035_001E,B25003_001E,B25003_002E'
          def acs(vintage, forclause, label):
              u = (f'https://api.census.gov/data/{vintage}/acs/acs5?get={urllib.parse.quote(GET)}'
                   f'&for={urllib.parse.quote(forclause)}&in=state:48')
              if ck: u += f'&key={ck}'
              bb = fetch(u, f'acs:{label}:{vintage}')
              if bb is None: return {'result': 'no 200'}
              v, err = jparse(bb, 'acs')
              return err or v
          PLACES = {}
          for key_name, label in [('New Braunfels city', 'New Braunfels'), ('San Marcos city', 'San Marcos')]:
              if key_name in POINTS:
                  PLACES[label] = POINTS[key_name]['geoid'][2:]  # strip state prefix
          F['acs']['place_fips'] = PLACES
          for label, pf in PLACES.items():
              F['acs'][f'place:{label}'] = acs('2023', f'place:{pf}', f'place-{label}')
          for label, cf in [('Comal', '091'), ('Hays', '209'), ('Travis', '453'), ('Bexar', '029')]:
              F['acs'][f'county:{label}'] = acs('2023', f'county:{cf}', f'county-{label}')
          # D · how far back does each grain go?
          hist = {}
          for vintage in ['2019', '2020', '2021', '2022', '2023']:
              if 'New Braunfels' in PLACES:
                  r = acs(vintage, f"place:{PLACES['New Braunfels']}", f'nb-{vintage}')
                  hist[vintage] = 'ok' if isinstance(r, list) and len(r) > 1 else r
          F['acs']['place_vintages_new_braunfels'] = hist

          json.dump({'findings': F, 'log': log}, open(f'{OUT}/probe-2.json', 'w'), indent=2)
          print(json.dumps({k: v for k, v in F.items() if k in ('points', 'city_to_metro_point_miles')}, indent=2))
          print(f'\n{len(log)} requests; skipped by robots: '
                f'{sum(1 for x in log if x["status"] == "SKIPPED_BY_ROBOTS")}')
          PY
      - name: Commit findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/perloc
          git commit -m "TEMPORARY: Round 41c probe findings" || echo "nothing to commit"
          git push
