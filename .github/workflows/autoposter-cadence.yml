# THI autoposter — the cadence driver.
#
# Fires daily; acts rarely. A run that does nothing because it is too soon, or because a gate
# did not return a clean pass, is a NORMAL outcome and exits 0 — a quiet week that turns the
# job red teaches you to ignore the red.
#
# What it does NOT do: decide anything. Every decision lives in autoposter/src/autopilot.py,
# which is proven by autoposter/tests/test_autopilot.py without touching the network. This file
# is a clock, a checkout and a set of credentials.
#
# THE KILL SWITCH is read here as a repository VARIABLE, so it can be flipped in the GitHub UI
# in seconds with no commit. `autopilot.paused` in config.yaml is the durable second switch.
# Either one pauses; both must be clear to publish.
name: autoposter cadence

on:
  schedule:
    # 14:10 UTC daily — mid-morning Texas, so a bad post is seen by a human within hours rather
    # than sitting overnight. Deliberately not on the hour: GitHub's scheduler is busiest then
    # and delays runs.
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and report, but never merge or post"
        type: boolean
        default: true
      prove_secret_scope:
        description: "Prove the secrets are Environment-scoped, not repo-scoped. Runs NO cycle."
        type: boolean
        default: false
      preflight_merge_path:
        description: "Prove push + PR create + merge + branch delete really work. Runs NO cycle."
        type: boolean
        default: false

concurrency:
  # One cycle at a time, ever. Two overlapping runs could both pass the duplicate gate before
  # either wrote to the ledger.
  group: autoposter-cadence
  cancel-in-progress: false

permissions:
  contents: write        # the auto-merge writes the article to main
  pull-requests: write   # ...through a PR, which is the audit record of what it published

jobs:
  # ------------------------------------------------------------------ the scope proof
  #
  # A wrongly-scoped secret resolves SILENTLY. `secrets.BLOTATO_API_KEY` reads the same in a
  # job whether the value came from the repository, the organization or the `autoposter`
  # Environment, so a UI list is the only ordinary way to tell — and a UI list is a thing you
  # trust rather than a thing you test. These two jobs test it.
  #
  # The mechanism is GitHub's own resolution rule, not a heuristic:
  #   * a job WITHOUT `environment:` can see repository and organization secrets, and CANNOT
  #     see environment secrets;
  #   * a job WITH `environment: autoposter` can see both, environment winning.
  # So: EMPTY in the first job and PRESENT in the second is only possible if the value lives in
  # the Environment. Either half failing localises the fault.
  #
  # Neither job prints, echoes, lengths or hashes any value. Presence is the entire observation.
  #
  # ONE HONEST LIMIT, stated because it changes how you read a failure: an ORGANIZATION secret
  # of the same name is also visible to the no-environment job. So a failure there means "repo
  # OR org scope", not "repo scope" — check both lists. It cannot produce a false PASS.
  #
  # Runs only on a `prove_secret_scope` dispatch. It never runs on the daily clock and it never
  # runs alongside a cycle.

  scope-must-be-absent-without-environment:
    if: inputs.prove_secret_scope
    runs-on: ubuntu-latest
    # DELIBERATELY no `environment:`. That absence is the instrument.
    steps:
      - name: Assert the secrets are NOT readable outside the autoposter environment
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          fail=0
          for name in BLOTATO_API_KEY SLACK_WEBHOOK_URL; do
            if [ -n "${!name}" ]; then
              echo "::error::${name} resolved in a job with NO environment, so it is scoped to the repository or the organization and every workflow in this repo can read it. Delete it from that scope and keep it only in the autoposter Environment."
              fail=1
            else
              echo "PASS  ${name} - absent without the environment, as required."
            fi
          done
          exit $fail

  scope-must-be-present-with-environment:
    if: inputs.prove_secret_scope
    runs-on: ubuntu-latest
    environment: autoposter
    steps:
      - name: Assert the secrets ARE readable inside the autoposter environment
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          fail=0
          for name in BLOTATO_API_KEY SLACK_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty inside environment autoposter, so the cycle would reach the posting step with no credential and halt there instead of publishing. Add it to the autoposter Environment."
              fail=1
            else
              echo "PASS  ${name} - present inside the environment, as required."
            fi
          done
          exit $fail

  scope-verdict:
    if: inputs.prove_secret_scope
    needs: [scope-must-be-absent-without-environment, scope-must-be-present-with-environment]
    runs-on: ubuntu-latest
    steps:
      - name: Record the verdict
        # Only reachable when BOTH halves passed, because `needs` will not run it otherwise.
        run: |
          {
            echo "## Secret scope: PROVEN environment-only"
            echo
            echo "\`BLOTATO_API_KEY\` and \`SLACK_WEBHOOK_URL\` were **unreadable** in a job with"
            echo "no environment and **readable** in a job with \`environment: autoposter\`."
            echo "No value was printed, measured or hashed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ the merge-path preflight
  #
  # Seven scheduled runs failed in production while every dry run and all 240 tests were green.
  # The cause was structural: `run_cycle` returns at the dry-run branch BEFORE `merge_fn` is
  # called, and every test stubs `merge_fn`, so the code that pushes and calls `gh` had never
  # run anywhere but the live cadence. It turned out the token could push but was refused at
  # `gh pr create` by a repo policy that is separate from `pull-requests: write`.
  #
  # A capability nobody exercised is a capability nobody has. This job exercises it for real —
  # push, PR create, merge to main, branch delete — then removes what it made. Run it before
  # trusting the cadence and after any change to permissions.

  preflight-merge-path:
    if: inputs.preflight_merge_path
    runs-on: ubuntu-latest
    environment: autoposter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the autoposter's dependencies
        # The preflight imports run_autopilot to exercise THE SAME merge code the cycle uses,
        # rather than a copy of it — so it inherits that module's imports, pyyaml included.
        # Reusing the real code is the point; paying for its dependencies is the price.
        run: pip install pyyaml

      - name: Prove the whole merge path, then clean up after itself
        working-directory: autoposter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/preflight-merge-path.py

  # ------------------------------------------------------------------ the cycle
  cycle:
    # A scope-proof dispatch proves scope and does nothing else. The proof jobs are cheap and
    # side-effect free; the cycle is neither.
    if: ${{ !inputs.prove_secret_scope && !inputs.preflight_merge_path }}
    runs-on: ubuntu-latest
    # The secrets live here and nowhere else. The site's own workflows cannot read them.
    environment: autoposter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the autoposter's dependencies
        run: pip install pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci

      - name: Install Chromium for the card renderer
        working-directory: site
        # The card generator refuses to screenshot until every brand face has loaded, so the
        # browser has to be real. npm ci installs playwright's driver, not its browser.
        run: npx playwright install --with-deps chromium

      - name: Run the autoposter's own test suite
        # A cycle that can publish must not run on code whose tests do not pass. This is the
        # cheapest possible guard against a bad merge reaching the live domain on a timer.
        working-directory: autoposter
        run: |
          failed=0
          for t in tests/test_*.py; do
            python3 "$t" || failed=1
          done
          exit $failed

      - name: Identify the committer
        run: |
          git config user.name  "thi-autoposter"
          git config user.email "noreply@texashomeintelligence.com"

      - name: Run the cycle
        working-directory: autoposter
        env:
          # THE KILL SWITCH. Set the repository variable AUTOPOSTER_PAUSED to `true` to halt
          # publishing immediately; the cycle still builds and still notifies.
          AUTOPOSTER_PAUSED: ${{ vars.AUTOPOSTER_PAUSED }}
          DRY_RUN: ${{ inputs.dry_run }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/run_autopilot.py
