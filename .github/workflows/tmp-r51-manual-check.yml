# TEMPORARY — Round 51. Delete when the round is decided.
#
# THE ONE CHECK THAT WOULD SETTLE IT. Austin's storage permits stepped up tenfold in July 2026
# while their descriptions became a template. Austin Energy's Solar Permitting Manual, published
# May 2026, requires an Auxiliary Power Electrical Permit for battery work. If an EARLIER revision
# did not, the step is a filing-rule change and the series is explained.
#
# This runs in Actions because the agent session cannot reach austinenergy.com, archive.org or
# services.austintexas.gov — measured, not assumed: the session's proxy answers 403 to CONNECT for
# archive.org and the austinenergy host does not resolve. A runner has open egress.
#
# It records QUOTES from a public utility document, which is the evidence for a decision about our
# own data. It downloads nothing into the repo but the extracted passages.
name: tmp r51 permitting-manual revision check

on:
  push:
    branches: [claude/thi-plan-review-m40n0x]
    paths:
      - ".github/workflows/tmp-r51-manual-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Ask the archive what captures exist, then read the earliest useful one
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, urllib.request, pathlib

          MANUAL = ("austinenergy.com/-/media/project/websites/austinenergy/green-power/solar/"
                    "austinenergy_solarpermittingmanual.pdf")
          out = {"target": MANUAL, "captures": [], "reachability": {}, "passages": {},
                 "verdict": None}

          def fetch(url, binary=False, timeout=90):
              req = urllib.request.Request(url, headers={"User-Agent": "thi-round-51-check"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read() if binary else r.read().decode("utf-8", "replace")

          # 1 · every capture the archive holds, newest first
          for pattern, label in ((MANUAL, "exact"), (MANUAL.rsplit("/", 1)[0] + "/*", "directory")):
              url = ("https://web.archive.org/cdx/search/cdx?url=" + urllib.parse.quote(pattern, safe="/*:")
                     + "&output=json&fl=timestamp,original,statuscode,digest&collapse=digest&limit=200")
              try:
                  rows = json.loads(fetch(url) or "[]")
                  out["reachability"][f"cdx_{label}"] = "ok"
                  for row in rows[1:]:
                      out["captures"].append(dict(zip(rows[0], row)) | {"via": label})
              except Exception as e:
                  out["reachability"][f"cdx_{label}"] = f"{type(e).__name__}: {e}"

          manual_caps = sorted({c["timestamp"] for c in out["captures"]
                                if c.get("original", "").endswith("solarpermittingmanual.pdf")})
          out["manualCaptureTimestamps"] = manual_caps
          before_may = [t for t in manual_caps if t < "20260501"]
          out["capturesBeforeMay2026"] = before_may

          # 2 · read the earliest pre-May capture, and the live copy for comparison
          TERMS = re.compile(r"auxiliary power|energy storage|\bess\b|batter\w*|permission to operate"
                             r"|meter socket|pre-?wire", re.I)
          def passages(pdf_bytes, name):
              p = pathlib.Path(f"/tmp/{name}.pdf"); p.write_bytes(pdf_bytes)
              txt = subprocess.run(["pdftotext", "-layout", str(p), "-"],
                                   capture_output=True, text=True).stdout
              lines = [re.sub(r"\s+", " ", l).strip() for l in txt.splitlines()]
              hits = [l for l in lines if l and TERMS.search(l)]
              # de-duplicate while keeping order; cap so the record stays a record
              seen, keep = set(), []
              for l in hits:
                  if l.lower() in seen: continue
                  seen.add(l.lower()); keep.append(l)
              return {"textLength": len(txt), "matchedLines": keep[:120],
                      "mentionsBatteryOnlyPermit": bool(re.search(
                          r"(batter|energy storage)[^.]{0,120}(auxiliary power|electrical permit)"
                          r"|auxiliary power[^.]{0,120}(batter|energy storage)", txt, re.I))}

          for ts in (before_may[:1] + (manual_caps[-1:] if manual_caps else [])):
              url = f"https://web.archive.org/web/{ts}id_/https://{MANUAL}"
              try:
                  out["passages"][ts] = passages(fetch(url, binary=True), ts)
              except Exception as e:
                  out["passages"][ts] = {"error": f"{type(e).__name__}: {e}"}

          try:
              out["passages"]["live"] = passages(fetch("https://" + MANUAL, binary=True), "live")
              out["reachability"]["live_pdf"] = "ok"
          except Exception as e:
              out["reachability"]["live_pdf"] = f"{type(e).__name__}: {e}"

          # 3 · PHRASE PRESENCE, over the FULL text of each capture — not over the filtered
          #     matched-line list. The hypothesis is that the live revision tells filers to split
          #     one project into several Auxiliary Power EPs where the January revision did not,
          #     which would multiply permits without multiplying installations. Inferring that
          #     from a phrase being absent from a FILTERED list would be the same
          #     absence-by-association mistake this round has already made twice.
          PHRASES = {
              "separated_into_their_own": r"separated\s+into\s+their\s+own",
              "can_be_included_together": r"can\s+be\s+included\s+together",
              "all_dg_requires_aux_power": r"will require an Auxiliary Power|require an Auxiliary Power Electrical Permit",
              "battery_storage_named": r"batter\w*\s+storage|battery\s+back-?up",
              "ess_defined": r"ESS\s*=\s*Energy Storage System",
              "project_includes_ess_trigger": r"project includes an Energy Storage System",
              "twentyfive_kw_threshold": r"25\s*kW",
              "revision_or_version_marker": r"THIS VERSION PUBLISHED|revision history|Rev\.\s*\d|Version\s*\d",
          }
          def phrase_table(pdf_bytes, name):
              q = pathlib.Path(f"/tmp/{name}-full.pdf"); q.write_bytes(pdf_bytes)
              txt = subprocess.run(["pdftotext", "-layout", str(q), "-"],
                                   capture_output=True, text=True).stdout
              flat = re.sub(r"\s+", " ", txt)
              return {k: bool(re.search(v, flat, re.I)) for k, v in PHRASES.items()}

          out["phrasePresence"] = {}
          for ts in before_may[:1]:
              try:
                  out["phrasePresence"][ts] = phrase_table(
                      fetch(f"https://web.archive.org/web/{ts}id_/https://{MANUAL}", binary=True), ts)
              except Exception as e:
                  out["phrasePresence"][ts] = {"error": f"{type(e).__name__}: {e}"}
          try:
              out["phrasePresence"]["live"] = phrase_table(fetch("https://" + MANUAL, binary=True), "live2")
          except Exception as e:
              out["phrasePresence"]["live"] = {"error": f"{type(e).__name__}: {e}"}

          out["verdict"] = (
              "no capture of this manual before 2026-05 exists in the archive; the question cannot "
              "be settled from a public archive and needs Austin Energy directly"
              if not before_may else
              f"a pre-May capture exists ({before_may[0]}); compare its passages with the live copy")
          pathlib.Path("docs/audits/round-51-manual-check.json").write_text(
              json.dumps(out, indent=2) + "\n")
          print(out["verdict"])
          print("captures of the manual:", manual_caps or "none")
          PY

      - name: Commit the finding, pass or fail
        if: always()
        run: |
          git config user.name  "thi-probe"
          git config user.email "noreply@texashomeintelligence.com"
          git add docs/audits/round-51-manual-check.json || true
          git diff --cached --quiet && { echo "nothing recorded"; exit 0; }
          git commit -m "Round 51: what the archive holds of Austin Energy's permitting manual

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          for i in 1 2 3 4; do git push origin HEAD:${GITHUB_REF_NAME} && break || sleep $((2**i)); done
