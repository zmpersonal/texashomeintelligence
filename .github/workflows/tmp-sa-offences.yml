# TEMPORARY — Round 38. DELETE THIS FILE BEFORE THE ROUND ENDS.
#
# Fetches ONE url and commits ONLY computed aggregates. The 55 MB of offence
# rows never enter the repository: they are streamed, counted in the runner,
# and thrown away with the runner.
#
# ROBOTS: data.sanantonio.gov's `User-agent: *` group contains `Disallow: /api/`.
# Round 37's probe called /api/3/action/ six times before that was noticed, and
# the audit carries the correction. This workflow therefore touches the resource
# download path and nothing else — no catalogue call, no discovery, no API.
name: TEMPORARY SA offences aggregate (Round 38)

on:
  push:
    branches: [claude/thi-v3-round38-sa-crime-article]
    paths: ['.github/workflows/tmp-sa-offences.yml']

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and aggregate
        run: |
          set -euo pipefail
          URL='https://data.sanantonio.gov/dataset/04991fd6-25aa-47ed-946c-4ea204ab3558/resource/f36bb931-8fb4-481c-83d9-a3589108bb20/download/pubsafedash_offenses.csv'
          mkdir -p tmp/sa
          code=$(curl -sS -L --max-time 600 -w '%{http_code}' -o /tmp/offences.csv \
                   -A 'TexasHomeIntelligence/1.0 (one-off research fetch; texashomeintelligence.com)' "$URL")
          echo "HTTP $code  $(wc -c < /tmp/offences.csv) bytes"
          if [ "$code" != "200" ]; then echo "RESOURCE URL DID NOT RESOLVE — stopping"; exit 1; fi
          python3 - <<'PY'
          import csv, json, collections, hashlib, datetime, os
          src = '/tmp/offences.csv'
          size = os.path.getsize(src)
          h = hashlib.sha256()
          with open(src, 'rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''): h.update(chunk)
          def dt_summary(dates, diffs):
              # What IS the DateTime column? Pass 1 kept only the twelve
              # smallest day differences, which said nothing about the shape.
              flat = sorted(k for k, n in diffs.items() for _ in range(n))
              total = len(flat) or 1
              pct = lambda q: flat[min(len(flat) - 1, int(total * q / 100))]
              return {
                  'min': min(dates) if dates else None,
                  'max': max(dates) if dates else None,
                  'distinct_dates': len(set(dates)),
                  'share_same_day_as_report': round(diffs.get(0, 0) / total, 6),
                  'share_datetime_after_report': round(sum(n for k, n in diffs.items() if k < 0) / total, 6),
                  'days_p0': pct(0), 'days_p1': pct(1), 'days_p25': pct(25),
                  'days_p50': pct(50), 'days_p75': pct(75), 'days_p99': pct(99),
                  'days_p100': pct(100),
              }

          rows = 0
          ids = set()
          blanks = collections.Counter()
          per_month = collections.Counter()
          against = collections.Counter()
          group = collections.Counter()
          offence = collections.Counter()
          zips, areas = set(), set()
          rep_min, rep_max = None, None
          dt_vs_rep = collections.Counter()   # (Report_Date - DateTime date) in days
          dt_parse_fail = 0
          dt_samples, dt_dates = [], []
          with open(src, newline='', encoding='utf-8', errors='replace') as fh:
              rd = csv.DictReader(fh)
              cols = rd.fieldnames
              for r in rd:
                  rows += 1
                  for k in cols:
                      if (r.get(k) or '').strip() in ('', 'NULL', 'null', 'N/A'): blanks[k] += 1
                  rid = (r.get('Report_ID') or '').strip()
                  if rid: ids.add(rid)
                  rep = (r.get('Report_Date') or '').strip()[:10]
                  if rep:
                      per_month[rep[:7]] += 1
                      rep_min = rep if rep_min is None or rep < rep_min else rep_min
                      rep_max = rep if rep_max is None or rep > rep_max else rep_max
                  against[(r.get('NIBRS_Crime_Against') or '').strip()] += 1
                  group[(r.get('NIBRS_Group') or '').strip()] += 1
                  offence[(r.get('NIBRS_Code_Name') or '').strip()] += 1
                  z = (r.get('Zip_Code') or '').strip()
                  if z: zips.add(z)
                  a = (r.get('Service_Area') or '').strip()
                  if a: areas.add(a)
                  dt = (r.get('DateTime') or '').strip()
                  if rep and dt:
                      try:
                          d1 = datetime.date.fromisoformat(rep)
                          d2 = datetime.date.fromisoformat(dt[:10])
                          dt_vs_rep[(d1 - d2).days] += 1
                          if len(dt_samples) < 5: dt_samples.append(dt)
                          dt_dates.append(dt[:10])
                      except ValueError:
                          dt_parse_fail += 1
          out = {
            'fetched_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
            'source_url': os.environ.get('SRC', ''),
            'file': {'bytes': size, 'sha256': h.hexdigest()},
            'columns': cols,
            'rows': rows,
            'distinct_report_ids': len(ids),
            'blank_by_column': dict(blanks),
            'report_date_min': rep_min, 'report_date_max': rep_max,
            'rows_per_month': dict(sorted(per_month.items())),
            'crime_against': dict(against.most_common()),
            'nibrs_group': dict(group.most_common()),
            'distinct_offence_names': len(offence),
            'top_offences': offence.most_common(20),
            'distinct_zips': len(zips), 'distinct_service_areas': len(areas),
            'report_minus_datetime_total': sum(dt_vs_rep.values()),
            'datetime_parse_failures': dt_parse_fail,
            'datetime_summary': dt_summary(dt_dates, dt_vs_rep),
            'datetime_examples': dt_samples,
          }
          with open('tmp/sa/offences-aggregate.json', 'w') as fh:
              json.dump(out, fh, indent=2)
          print(json.dumps({k: v for k, v in out.items()
                            if k not in ('rows_per_month', 'top_offences', 'blank_by_column')}, indent=2))
          PY
        env:
          SRC: 'https://data.sanantonio.gov/dataset/04991fd6-25aa-47ed-946c-4ea204ab3558/resource/f36bb931-8fb4-481c-83d9-a3589108bb20/download/pubsafedash_offenses.csv'

      - name: Commit aggregate only
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp/sa
          git commit -m "TEMPORARY: SA offences aggregate (computed in the runner; no rows)" || echo "nothing to commit"
          git push
